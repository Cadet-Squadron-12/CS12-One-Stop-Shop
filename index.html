/* Layout: black patch-style masthead with a red/yellow runway stripe, tab rail, one wide working column.
   Palette comes from the CS-12 patch: patch blue, black, white, runway red and yellow, flight-line grey. */
:root{
  --bg:#F1F5FB; --surface:#FFFFFF; --sunk:#E4ECF6; --line:#C9D6E8;
  --ink:#10141B; --muted:#4F5B6E;
  --navy:#0E1116; --sun:#F5C518; --coral:#D62828; --sky:#2F5FA8; --mint:#17975F; --grape:#7A5AF8;
  --patch:#9DC1E6; --patch-deep:#6F96CD; --flight:#A8B4C0;
  --sun-soft:#FDF2C4; --coral-soft:#FBE0E0; --sky-soft:#DDE9F8; --mint-soft:#D5F0E3; --grape-soft:#ECE6FE;
  --on-accent:#10141B; --cell-ink:#141414; --mast-sub:#B9C4D4; --mast-hover:#232A35;
  --display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:12px;
  /* class colors: '27 yellow, '28 blue, '29 grey, '30 red (they cycle every 4 years: '31 is yellow again) */
  /* taken from the CS-12 patch: runway yellow, patch blue, flight-line grey, runway red */
  --y3:#F5C518; --y3-ink:#10141B; --y3-soft:#FDF2C4;
  --y0:#6F96CD; --y0-ink:#0E1116; --y0-soft:#E1ECF8;
  --y1:#A8B4C0; --y1-ink:#0E1116; --y1-soft:#EDF0F3;
  --y2:#D62828; --y2-ink:#FFFFFF; --y2-soft:#FBE0E0;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0E13; --surface:#141920; --sunk:#1C232D; --line:#2A3441;
  --ink:#EEF2F8; --muted:#A3AFC0; --navy:#06080B; --sky:#7FA8E0;
  --sun-soft:#3A3110; --coral-soft:#3F1B1B; --sky-soft:#18273D; --mint-soft:#11352A; --grape-soft:#2C2457;
  color-scheme:dark 
  --y3:#F5C518; --y3-soft:#3A3110; --y0:#9DC1E6; --y0-soft:#1B2A3E; --y1:#A8B4C0; --y1-soft:#262B33; --y2:#E5484D; --y2-soft:#3B1718;}}
:root[data-theme="dark"]{

.ctag.y0{background:var(--y0);color:var(--y0-ink)} .ctag.y1{background:var(--y1);color:var(--y1-ink)} .ctag.y2{background:var(--y2);color:var(--y2-ink)} .ctag.y3{background:var(--y3);color:var(--y3-ink)}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px;flex:none}
.cdot.y0{background:var(--y0)} .cdot.y1{background:var(--y1)} .cdot.y2{background:var(--y2)} .cdot.y3{background:var(--y3)}
tr.y0>td:first-child{box-shadow:inset 4px 0 0 var(--y0)} tr.y1>td:first-child{box-shadow:inset 4px 0 0 var(--y1)} tr.y2>td:first-child{box-shadow:inset 4px 0 0 var(--y2)} tr.y3>td:first-child{box-shadow:inset 4px 0 0 var(--y3)}
.week .rl.y0{background:var(--y0);color:var(--y0-ink)} .week .rl.y1{background:var(--y1);color:var(--y1-ink)} .week .rl.y2{background:var(--y2);color:var(--y2-ink)} .week .rl.y3{background:var(--y3);color:var(--y3-ink)}
.week .yc.y0{background:var(--y0-soft)} .week .yc.y1{background:var(--y1-soft)} .week .yc.y2{background:var(--y2-soft)} .week .yc.y3{background:var(--y3-soft)}
.mwl li.ycls{border-left:3px solid var(--line);padding-left:6px} .mwl li.ycls.y0{border-color:var(--y0)} .mwl li.ycls.y1{border-color:var(--y1)} .mwl li.ycls.y2{border-color:var(--y2)} .mwl li.ycls.y3{border-color:var(--y3)}
.clegend{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.linkbtn{background:none;border:0;padding:2px;color:var(--sky);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--on-accent)}

/* sheet grids */
.sheet{border-collapse:collapse;font-size:12px}
.sheet td{border:1px solid var(--line);padding:3px 6px;min-width:46px;height:24px;white-space:pre-line;vertical-align:middle;text-align:center}
.sheet td.f{color:var(--cell-ink)}
.sheet td.ed{cursor:text}
.sheet td.ed:hover{outline:2px solid var(--sky);outline-offset:-2px}
/* checklists */
.cols4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.ck{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;font-size:14px;cursor:pointer;min-width:0}
.ck:hover{background:var(--sunk)}
.ck input{width:17px;height:17px;accent-color:var(--mint);flex:none}
.ck.on{color:var(--mint);font-weight:600}
.ck .nt{flex:1;min-width:0}
.ck input.note{width:auto;flex:1;padding:2px 5px;font-size:12px}
/* builder */
.doccards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;margin-bottom:16px}
.doccard{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.doccard b{font-family:var(--display);font-size:17px}
.doccard span{font-size:12.5px;color:var(--muted)}
.doccard[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft)}
.para{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.para .row{justify-content:space-between}
.routing td{padding:4px 6px}
.routing input,.routing select{padding:4px 6px}
.lock{max-width:440px;margin:30px auto;text-align:center}
.lock .key{font-size:44px;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:999px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:20;max-width:calc(100% - 32px)}
.confirm{display:inline-flex;gap:6px;align-items:center;background:var(--coral-soft);border-radius:8px;padding:3px 6px;font-size:13px}
.empty{padding:22px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:var(--r)}
details.box{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 14px}
details.box summary{cursor:pointer;font-weight:700}

.daily{background:linear-gradient(165deg,var(--patch) 0%,var(--patch-deep) 100%);color:#0E1116;border-radius:var(--r);padding:18px 20px 16px;position:relative;overflow:hidden;border-bottom:6px solid var(--sun);box-shadow:inset 0 -3px 0 var(--coral)}
.daily-logo{position:absolute;right:18px;top:50%;transform:translateY(-50%);height:118px;width:auto;pointer-events:none}
.daily-top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#1B2433;border-bottom:1px solid rgba(14,17,22,.25);padding-bottom:8px;margin-right:130px;font-weight:600}
.daily-name{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,54px);letter-spacing:-.02em;line-height:1.02;margin:10px 130px 4px 0;color:#0E1116;text-wrap:balance}
.daily-tag{font-size:15px;color:#1B2433;font-style:italic;margin-right:130px}
.big-name{font-family:var(--display);font-size:22px;font-weight:800;margin-top:4px;overflow-wrap:anywhere}
.tl{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.track{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.step{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:2px 10px 2px 3px;font-size:12.5px;font-weight:600;font-family:inherit}
button.step{cursor:pointer}
.step i{font-style:normal;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--sunk);font-size:11px}
.step.done{color:var(--mint);border-color:transparent;background:var(--mint-soft)} .step.done i{background:var(--mint);color:#fff}
.step.now{color:var(--ink);border-color:var(--sun);background:var(--sun-soft)} .step.now i{background:var(--sun);color:var(--navy)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.ph{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.ph img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--sunk)}
.ph figcaption{display:flex;gap:6px;align-items:center;padding:6px 8px;font-size:13px;min-width:0}
.ph figcaption .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.sdolay{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.sdolay{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.cal{gap:2px}.cal .d{font-size:10.5px;padding:3px;min-height:56px}.cal .dn{font-size:9.5px;padding:0}}
@media (max-width:640px){ .daily-logo{height:70px;top:16px;transform:none;right:12px} .daily-top{margin-right:78px} .daily-name,.daily-tag{margin-right:0} .mast .who{font-size:11px} .mast .who .pill{display:none} .mast .top{gap:10px} .mast h1{font-size:20px} nav.tabs{-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent);padding-right:40px} nav.tabs button{padding:7px 10px;font-size:13.5px} table.umd td{white-space:nowrap} .week{min-width:900px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  <div class="wrap">

<div id="toast" class="toast" hidden></div>
<script>window.CS12_VERSION='2026-10-30';</script>
<script>
"use strict";
/* ---------- tiny DOM helper ---------- */
function h(tag, a, ...kids){
  const el=document.createElement(tag);
  if(a) for(const k in a){
    const v=a[k]; if(v==null||v===false) continue;
    if(k==='onclick') el.addEventListener('click',clickGuard(v)); // a button can't fire twice while its save is still running
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else if(k==='class') el.className=v;
    else if(k==='style') el.style.cssText=v;
    else if(k==='value') el.value=v;
    else if(k==='checked') el.checked=!!v;
    else el.setAttribute(k,v===true?'':v);
  }
  add(el,kids); return el;
}
function add(el,kids){for(const k of kids){ if(k==null||k===false) continue; if(Array.isArray(k)) add(el,k); else el.append(k instanceof Node?k:document.createTextNode(String(k))); }}
const $=s=>document.querySelector(s);
function clickGuard(fn){ return function(e){ const el=e.currentTarget; if(el&&el.dataset&&el.dataset.busy) return; let r; try{ r=fn.call(this,e); }catch(err){ console.error(err); toast('Something went wrong. Try again.'); return; }
  if(r&&typeof r.then==='function'&&el&&el.tagName==='BUTTON'){ el.dataset.busy='1'; el.setAttribute('aria-busy','true'); el.disabled=true;
    r.catch(err=>{ console.error(err); toast('Something went wrong. Try again.'); }).finally(()=>{ delete el.dataset.busy; el.removeAttribute('aria-busy'); el.disabled=false; }); } }; }
// only web, email and phone links (and our own pictures) can be opened from stored data
function safeUrl(u,allowImg){ u=String(u||'').trim(); if(/^(https?:\/\/|mailto:|tel:)/i.test(u)) return u; if(allowImg&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(u)) return u; return '#'; }
let _lastErrToast=0;
function softError(msg){ const n=Date.now(); if(n-_lastErrToast>8000){ _lastErrToast=n; try{ toast(msg); }catch(e){} } }
window.addEventListener('error',e=>{ console.error(e.error||e.message); });
window.addEventListener('unhandledrejection',e=>{ console.error(e.reason); softError('Something didn’t finish. Check your connection and try again.'); });
window.addEventListener('offline',()=>{ softError('You’re offline. Changes won’t save until you reconnect.'); try{ renderTabs(); }catch(e){} });
window.addEventListener('online',()=>{ try{ toast('Back online'); renderTabs(); }catch(e){} });
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function ls(k,v){try{ if(v===undefined){const s=localStorage.getItem('cs12:'+k);return s?JSON.parse(s):null} localStorage.setItem('cs12:'+k,JSON.stringify(v)) }catch(e){return null}}
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(s){ if(!s||typeof s!=='string'||!/^\d{4}-\d{1,2}-\d{1,2}/.test(s)) return typeof s==='string'?s:''; const [y,m,d]=s.split('-').map(Number); return `${d} ${MONTHS[m-1]} ${y}`; }
function fmtShort(s){ if(!s||typeof s!=='string'||!/^\d{4}-\d{1,2}-\d{1,2}/.test(s)) return typeof s==='string'?s:''; const [y,m,d]=s.split('-').map(Number); return `${pad(d)} ${MON3[m-1]} ${String(y).slice(2)}`; }
const today=()=>iso(new Date());
const money=n=>'$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
function workdaysBetween(fromIso,toIso){ let d=new Date(fromIso+'T12:00'),e=new Date(toIso+'T12:00'),n=0; if(e<=d) return 0; while(d<e){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w&&w<6) n++; } return n; }
/* class years and colors: C1C..C4C roll over each June; colors follow the class year ('27 yellow, '28 blue, '29 grey, '30 red, then repeat) */
function clsToYear(cls){ const n={C1C:1,C2C:2,C3C:3,C4C:4}[String(cls||'').toUpperCase().replace(/\s/g,'')]; if(!n) return ''; const d=new Date(); const firstie=d.getMonth()>=5?d.getFullYear()+1:d.getFullYear(); return String(firstie+n-1); }
function yearOf(x){ x=String(x||'').trim(); const y=clsToYear(x); if(y) return y; const m=x.match(/(?:^|\D)(20\d\d)(?:\D|$)/); if(m) return m[1]; const s=x.match(/^[’'](\d\d)$/); return s?'20'+s[1]:''; }
const ycls=y=>y?'y'+(+y%4):'';
// the four current class years, firsties first; these roll over by themselves every June, so nothing needs editing each year
const CLS_LEVELS=['C1C','C2C','C3C','C4C'];
const classYears=()=>CLS_LEVELS.map(clsToYear);
/* site settings an admin can change without touching code (Admin → Site settings) */
const siteSettings=()=>D('config/settings')||{};
function flightNames(){ const f=String(siteSettings().flights||'').split(',').map(x=>x.trim().replace(/\s+Flight$/i,'')).filter(Boolean); return f.length?f:['Alpha','Bravo','Charlie','Delta']; }
const reEsc=s=>String(s).replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&');
const flightRe=whole=>{ const alt=flightNames().map(reEsc).join('|'); return new RegExp(whole?'^('+alt+') Flight$':'('+alt+')'); };
const flightOf=letter=>flightNames().find(n=>n[0]===letter)||'';
const flightOptions=()=>flightNames().map(n=>[n[0],n+' Flight']);
function clsTag(x,label){ const y=yearOf(x); if(!y) return x?h('span',null,x):null; return h('span',{class:'ctag '+ycls(y),title:'Class of '+y},label||(/^C\dC$/i.test(String(x).trim())?String(x).toUpperCase():"’"+y.slice(2))); }
function personYear(name){ const p=allPeople().find(x=>sameNameLoose(x.name,name)&&x.cls); return p?yearOf(p.cls):''; }
function sameNameLoose(a,b){ a=norm(a); b=norm(b); return !!a&&!!b&&(a===b||(a.split(' ').pop()===b.split(' ').pop()&&a[0]===b[0])); }
function nameDot(name){ const y=personYear(name); return y?h('span',{class:'cdot '+ycls(y),title:'Class of '+y}):null; }
function classLegend(){ const d=new Date(); const f=d.getMonth()>=5?d.getFullYear()+1:d.getFullYear(); return h('span',{class:'clegend'},[0,1,2,3].map(i=>clsTag(String(f+i)))); }
const norm=s=>(s||'').toString().trim().toLowerCase().replace(/\s+/g,' ');

/* ---------- app state ---------- */
const S={docs:{}, loaded:{}, _c:{}, ready:false, canEdit:false, canWrite:true, db:null, user:null, downloads:null, tab:'home', sub:{}, edit:{}, pending:false};
const DOCS=['config/site','config/meta','config/settings','roster/main','staff/contacts','staff/notes','taskers/board','sdo/schedule','cq/board','allcall/board','recall/board','signoff/form1','signoff/rooming','life/birthdays','life/pairings','grids/mitches','grids/lockers','grids/rooming','grids/coc','week/astaff','staff/exports','staff/meta','staff/turnover','a46/vault','staff/a46import'];
/* ---------- live data, loaded only when a page needs it ----------
   Firestore's free plan counts every record sent to every browser, so the site only listens to what the open tab
   actually shows: a record starts streaming the first time a tab asks for it (D('roster/main'), S.signout, ...),
   and a page that is only showing one tab never downloads the others. While a browser tab sits in the background
   for 10+ minutes every listener is paused; it resumes (only the changes are re-sent) when the person comes back. */
const LIVE={};
function live(key,start){ if(LIVE[key]||!S.db) return; LIVE[key]={start,unsub:null}; if(!S.paused) LIVE[key].unsub=start(); }
function liveStop(key){ const l=LIVE[key]; if(!l) return; try{ l.unsub&&l.unsub(); }catch(e){} delete LIVE[key]; }
function pauseLive(){ if(S.paused) return; S.paused=true; for(const k in LIVE){ try{ LIVE[k].unsub&&LIVE[k].unsub(); }catch(e){} LIVE[k].unsub=null; } }
function resumeLive(){ if(!S.paused) return; S.paused=false; for(const k in LIVE){ try{ LIVE[k].unsub=LIVE[k].start(); }catch(e){ console.warn(k,e); } } }
document.addEventListener('visibilitychange',()=>{ clearTimeout(pauseLive.t); if(document.hidden) pauseLive.t=setTimeout(pauseLive,10*60e3); else resumeLive(); });
// when the daily free allowance runs out, keep showing the saved copy and try again later instead of hammering Firestore
function liveErr(key,e){ console.warn(key,e); if(e&&/resource-exhausted/.test(e.code||'')){ S.quota=Date.now(); const l=LIVE[key]; if(l){ l.unsub=null; setTimeout(()=>{ if(LIVE[key]===l&&!l.unsub&&!S.paused) l.unsub=l.start(); },20*60e3); } schedule(); } }
function noteUse(k){ if(S._using) S._using.add(k); }
function listenDoc(p){ live('d:'+p,()=>S.db.doc(p).onSnapshot(s=>{ S.docs[p]=s.exists?normDoc(p,s.data()):null; S.loaded[p]=true; schedule('d:'+p); },e=>{ S.loaded[p]=true; liveErr('d:'+p,e); })); }
const loaded=p=>!!S.loaded[p];
const D=p=>{ noteUse('d:'+p); if(S.db&&!LIVE['d:'+p]){ listenDoc(p); const u=S.onUse&&S.onUse[p]; if(u) u(); } const v=S.docs[p]; const o=S.overlay&&S.overlay[p]; return (v&&o)?o(v):v; };
// lists: newest N records, or (eSSS trips) only trips that haven't been over for more than 45 days
const daysAgoIso=n=>iso(new Date(Date.now()-n*864e5));
const SO_WINDOW=1; // live: trips not over yet (the calendar and monthly log fetch older months once, on request)
const COLS={
  dirt:{path:'dirt',newest:40}, photos:{path:'photos',newest:48},
  signout:{path:'signout',since:()=>daysAgoIso(SO_WINDOW),max:800},
  headsup:{path:'headsup',newest:250}, mine:{path:()=>'data/users/'+S.uid,newest:150,need:()=>!!S.uid},
  ldr:{path:'ldrtasks',newest:150,shape:'ldrtasks'}, ldrOpen:{path:'ldrtasks',eq:'open',max:300,shape:'ldrtasks'},
  actions:{path:'actions',eq:'open',max:200},
  discipline:{path:'discipline',newest:300,need:()=>S.canEdit}
};
function listenCol(k){ const c=COLS[k]; if(LIVE['c:'+k]||!S.db||(c.need&&!c.need())) return;
  live('c:'+k,()=>S.db.collection(typeof c.path==='function'?c.path():c.path,{newest:c.newest,since:c.since&&c.since(),eq:c.eq,max:c.max}).onSnapshot(q=>{ S._c[k]=normCol(c.shape||k,q.docs.map(d=>({id:d.id,...d.data()}))); S.loaded['c:'+k]=true; schedule('c:'+k); },e=>liveErr('c:'+k,e))); }
for(const k in COLS){ S._c[k]=[]; Object.defineProperty(S,k,{get(){ noteUse('c:'+k); listenCol(k); return S._c[k]; },set(v){ S._c[k]=v; },configurable:true}); }
/* ---------- data shape guard ----------
   Every record is repaired to the shape the tabs expect as it loads, so a half-saved record,
   an old version's data or a typo can't crash a tab. ''/0/[]/{} stand for "a string/number/list/object of this shape";
   {__map__:T} is a lookup keyed by ids or dates whose values look like T; null means "leave as is". */
const SHAPES={
  'config/site':{links:[{label:'',url:''}],outlook:{days:[''],quote:'',title:'',rows:[{label:'',cells:['']}]},leaders:[{name:'',role:'',phone:'',email:''}]},
  'roster/main':{sections:[{name:'',people:[{cls:'',flight:'',name:'',pos:'',rank:''}]}],unitCC:''},
  'staff/contacts':{byName:{__map__:{email:'',phone:''}}},
  'staff/notes':{cwocDoorCode:''},
  'taskers/board':{columns:[{id:'',label:''}],groups:[{name:'',people:[{id:'',name:'',rank:''}]}],status:{__map__:{__map__:null}}},
  'sdo/schedule':{days:{__map__:''},notes:{__map__:''},overview:['']},
  'cq/board':{c28:[{name:'',nick:''}],c29:[{name:'',nick:''}],fill:{__map__:''},weeks:[{days:[''],label:'',month:'',weLabel:'',rows:[{wd:'',we:'',slots:[{id:'',k:'',w:''}]}]}]},
  'allcall/board':{groups:[{name:'',people:['']}],here:{__map__:null}},
  'recall/board':{classes:[{year:'',people:['']}],status:{__map__:null}},
  'signoff/form1':{classes:[{year:'',people:['']}],signed:{__map__:null},title:''},
  'signoff/rooming':{classes:[{year:'',people:['']}],signed:{__map__:null},title:''},
  'life/birthdays':{list:[{md:'',name:''}]},
  'life/pairings':{rows:[{flight:'',sup:'',sees:['']}]},
  'grids/mitches':{title:'',maxr:0,maxc:0,cells:{__map__:''},fills:{__map__:''},merges:[[0]]},
  'grids/lockers':{title:'',maxr:0,maxc:0,cells:{__map__:''},fills:{__map__:''},merges:[[0]]},
  'grids/rooming':{title:'',maxr:0,maxc:0,cells:{__map__:''},fills:{__map__:''},merges:[[0]]},
  'grids/coc':{title:'',maxr:0,maxc:0,cells:{__map__:''},fills:{__map__:''},merges:[[0]]},
  'week/astaff':{weekly:{__map__:['']}},
  'config/meta':{soK:false,hs2so:false,pruned:''},'config/settings':{flights:'',rename:[{from:'',to:''}],oconus:{thanks:'',winter:''}},'staff/meta':{lastBackup:'',lastBackupBy:''},'staff/turnover':{term:'',started:'',by:'',done:{__map__:null}},
  'staff/exports':{exec:{__map__:null},shirt:{__map__:null}},
  'a46/vault':null,'staff/a46import':null
};
const COL_SHAPES={
  signout:{name:'',kind:'',depart:'',ret:'',departTime:'',retTime:'',where:'',note:'',unit:''},
  headsup:{kind:'Paperwork',from:'',subject:'(details missing)',extra:'',suspense:'',routing:[''],signed:{__map__:null},status:'Active',created:''},
  dirt:{text:'',cat:'',date:''},
  photos:{url:'',caption:'',created:''},
  actions:{text:'',owner:'',due:''},
  ldrtasks:{title:'',assignee:'',due:'',status:'',byRole:''},
  mine:{text:'',due:'',kind:'',title:''},
  discipline:{items:{__map__:{kind:'',status:'',created:'',from:''}}}
};
const isObj=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
function shapeOf(v,t){
  if(t===null||t===undefined) return v;
  if(Array.isArray(t)){ if(!Array.isArray(v)) return []; const it=t[0]; return it===undefined?v.slice():v.filter(x=>x!==null&&x!==undefined).map(x=>shapeOf(x,it)); }
  if(isObj(t)){
    if('__map__' in t){ const o=isObj(v)?v:{}; const out={}; for(const k in o){ if(o[k]!==null&&o[k]!==undefined) out[k]=shapeOf(o[k],t.__map__); } return out; }
    const o=isObj(v)?v:{}; const out={...o}; for(const k in t) out[k]=shapeOf(o[k],t[k]); return out;
  }
  if(typeof t==='string'){ if(typeof v==='string') return v; if(v===null||v===undefined||typeof v==='object') return t; return String(v); }
  if(typeof t==='number'){ const n=typeof v==='number'?v:parseFloat(v); return isFinite(n)?n:0; }
  if(typeof t==='boolean') return !!v;
  return v;
}
function normDoc(path,data){ if(!isObj(data)) return null; try{ return path in SHAPES?shapeOf(data,SHAPES[path]):data; }catch(e){ console.warn('shape',path,e); return data; } }
function normCol(name,items){ const t=COL_SHAPES[name]; return (items||[]).filter(isObj).map(x=>{ try{ const out=t?shapeOf(x,t):x; out.id=x.id; return out; }catch(e){ return x; } }); }

async function boot(){
  render();
  const api=window.cs12api; // set by the Firebase section once someone is signed in
  if(!api||!api.use){ S.ready=true; S.nodb=true; render(); return; }
  const [db,user,dl,assets]=await Promise.all([api.use('db'),api.use('user'),api.use('downloads'),api.use('assets')]);
  S.db=db; S.user=user; S.downloads=dl; S.assets=assets; if(user) S.uid=await user.id();

// Tonight's CQ shifts from the sign-up sheet (weekday block Mon–Thu, weekend block Fri–Sun)
function cqTonight(){
  const q=D('cq/board'); if(!q) return null; const now=new Date(); const t=new Date(today()+'T12:00'); const dow=now.getDay(); const yr=now.getFullYear();
  const weekend=dow===0||dow===5||dow===6; const fill=q.fill||{};
  const parse=lbl=>{ const m=(lbl||'').match(/(\d{1,2})\/(\d{1,2})\s*-\s*(\d{1,2})\/(\d{1,2})/); if(!m) return null; return [new Date(yr,+m[1]-1,+m[2],12),new Date(yr,+m[3]-1,+m[4],12)]; };
  for(const w of q.weeks){ const r=parse(weekend?w.weLabel:w.label); if(!r||t<r[0]||t>r[1]) continue;
    const col=weekend?({5:4,6:5,0:6})[dow]:dow-1;
    const shifts=w.rows.map(row=>({time:weekend?row.we:row.wd,slot:row.slots[col]})).filter(x=>x.time&&x.slot&&x.slot.k!=='x').map(x=>({time:x.time,name:fill[x.slot.id]||''}));

 apply.\nDISCLOSURE:\u00a0 Voluntary, failure to provide SSN may impede proper placement in member's military personnel file.\nSORN:\u00a0 F036 AF PC L, Unfavorable Information Files (UIF).","sz":8.0,"b":true,"i":false,"al":"left"},{"t":"text","x":40.6,"y":150.57,"w":254.13,"h":8.67,"s":"1. Determine the objective of the counseling before the session begins.","sz":8.0,"b":false,"i":false,"al":"left"},{"t":"text","x":40.6,"y":159.57,"w":107.13,"h":8.67,"s":"2. Hear the individual out.","sz":8.0,"b":false,"i":false,"al":"left"},{"t":"text","x":40.6,"y":168.57,"w":213.62,"h":8.67,"s":"3. Treat the member as having worth and dignity.","sz":8.0,"b":false,"i":false,"al":"left"},{"t":"text","x":40.6,"y":177.57,"w":253.37,"h":8.67,"s":"4. Show sincerity, courtesy, and personal interest in the individual.","sz":8.0,"b":false,"i":false,"al":"left"},{"t":"text","x":40.6,"y":186.57,"w":261.62,"h":8.67,"s":"5. Give the individual the facts, whether they are pleasant or unpleasant.","sz":8.0,"b":false,"i":false,"al":"left"},{"t":"text","x":40.6,"y":196.57,"w":212.89,"h":8.67,"s":"6. Don't brush off any problem as being too trivial.","sz":8.0,"b":false,"i":false,"al":"left"},{"t":"text","x":40.6,"y":206.3,"w":171.62,"h":8.67,"s":"7. Don't make snap decisions.","sz":8.0,"b":false,"i":false,"al":"left"},{"t":"text","x":314.2,"y":150.57,"w":204.02,"h":8.67,"s":"8. Don't make promises if you can't keep them.","sz":8.0,"b":false,"i":false,"al":"left"},{"t":"text","x":314.2,"y":159.83,"w":259.52,"h":17.6,"s":"9. Don't force decisions on the person - there may be other equally good and acceptable solutions.","sz":8.0,"b":false,"i":false,"al":"left"},{"t":"text","x":314.2,"y":180.51,"w":147.04,"h":8.67,"s":"10. Refer to other agencies.","sz":8.0,"b":false,"i":false,"al":"left"},{"t":"text","x":314.2,"y":189.68,"w":226.52,"h":8.67,"s":"11. Make contact for the individual with the referral agency.","sz":8.0,"b":false,"i":false,"al":"left"},{"t":"text","x":314.2,"y":199.41,"w":258.78,"h":17. <script>
const ymd8=s=>s?String(s).replace(/-/g,''):''; // eSSS dates print as YYYYMMDD

/* ================= PDF ENGINE (pdf-lib) ================= */
const PH=792, PW=612;
const WIN=/[^\x20-\x7E\xA0-\xFF–—‘’“”•…\n]/g;
const clean=s=>String(s==null?'':s).replace(/\u2192/g,'>').replace(/\r\n?/g,'\n').replace(/\t/g,'    ').replace(WIN,'');
function wrapText(text,font,size,width){
  const out=[];
  clean(text).split('\n').forEach(par=>{
    if(par==='') { out.push(''); return; }
    const words=par.split(/(\s+)/); let line='';
    for(const w of words){
      const test=line+w;
      if(font.widthOfTextAtSize(test.trimEnd(),size)<=width||!line.trim()){
        if(!line.trim()&&font.widthOfTextAtSize(w,size)>width){ // hard-break a long token
          let chunk=''; for(const ch of w){ if(font.widthOfTextAtSize(chunk+ch,size)>width){ out.push(chunk); chunk=ch; } else chunk+=ch; } line=chunk; continue; }
        line=test;
      } else { out.push(line.trimEnd()); line=w.trimStart(); }
    }
    out.push(line.trimEnd());
  });
  return out;
}
async function pdfFonts(doc){ const F=PDFLib.StandardFonts; return {h:await doc.embedFont(F.Helvetica),hb:await doc.embedFont(F.HelveticaBold),hi:await doc.embedFont(F.HelveticaOblique),hbi:await doc.embedFont(F.HelveticaBoldOblique),t:await doc.embedFont(F.TimesRoman),tb:await doc.embedFont(F.TimesRomanBold)}; }
function addSig(doc,page,name,x,yTop,w,hh){
  const {PDFName,PDFString}=PDFLib; const ctx=doc.context;
  const widget=ctx.obj({Type:'Annot',Subtype:'Widget',FT:'Sig',F:4,Rect:[x,PH-yTop-hh,x+w,PH-yTop],P:page.ref});
  widget.set(PDFName.of('T'),PDFString.of(name));
  const ref=ctx.register(widget);
  page.node.addAnnot(ref);
  doc.getForm().acroForm.addField(ref);
}
// Editable text box: prefilled, transparent, so people can keep typing in Adobe after download
function tf(doc,page,font,name,x,yTop,w,hh,val,o={}){
  const form=doc.getForm(); doc.__names=doc.__names||new Set(); let n=String(name).replace(/[.\s]+/g,'_'); let base=n,i=1; while(doc.__names.has(n)||form.getFieldMaybe(n)) n=base+'_'+(++i); doc.__names.add(n);
  const f=form.createTextField(n); if(o.multi) f.enableMultiline(); else f.disableMultiline(); f.disableRichFormatting&&f.disableRichFormatting();
  f.addToPage(page,{x,y:PH-yTop-hh,width:w,height:hh,borderWidth:0,borderColor:undefined,backgroundColor:undefined,font});
  if(o.align==='center') f.setAlignment(PDFLib.TextAlignment.Center); else if(o.align==='right') f.setAlignment(PDFLib.TextAlignment.Right);
  f.setFontSize(o.size||0); if(val!=null&&val!=='') f.setText(clean(val)); f.updateAppearances(font); return f;
}
function drawSpecPage(doc,page,spec,vals,F,sigPrefix){
  const black=PDFLib.rgb(0,0,0);
  for(const it of spec.items){
    if(it.t==='line') page.drawLine({start:{x:it.x1,y:PH-it.y1},end:{x:it.x2,y:PH-it.y2},thickness:0.6,color:black});
    else if(it.t==='rect') page.drawRectangle({x:it.x,y:PH-it.y-it.h,width:it.w,height:it.h,borderColor:black,borderWidth:0.75});
    else if(it.t==='text'){
      const f=it.b&&it.i?F.hbi:it.b?F.hb:it.i?F.hi:F.h; const sz=it.sz||8;
      const lines=wrapText(it.s,f,sz,Math.max(it.w,20)+2); let y=it.y+sz;
      for(const ln of lines){ let x=it.x; const tw=f.widthOfTextAtSize(ln,sz); if(it.al==='center') x=it.x+(it.w-tw)/2; else if(it.al==='right') x=it.x+it.w-tw; page.drawText(ln,{x,y:PH-y,size:sz,font:f,color:black}); y+=sz*1.18; }
    }
    else if(it.t==='field'){
      const v=vals[it.k]; const multi=it.ml||String(v||'').includes('\n'); let sz=it.sz||9;
      if(multi&&v){ for(;;){ const lines=wrapText(v,F.h,sz,(it.w-4)*0.97); if(lines.length*sz*1.17<=it.h||sz<=6) break; sz-=0.5; } }
      else if(v){ while(F.h.widthOfTextAtSize(clean(v),sz)>it.w-4&&sz>6) sz-=0.5; }
      tf(doc,page,F.h,(sigPrefix||'')+it.k,it.x,it.y,it.w,it.h,v,{multi,size:sz,align:it.al==='center'?'center':null});
    }
    else if(it.t==='sig') addSig(doc,page,(sigPrefix||'')+it.k,it.x,it.y,it.w,it.h);
  }
}
async function appendPdf(doc,src){ // copy pages AND keep their form fields live (signature boxes stay clickable)
  const {PDFName}=PDFLib; const pages=await doc.copyPages(src,src.getPageIndices());
  const acro=doc.getForm().acroForm; const seen=new Set();
  for(const p of pages){ doc.addPage(p); const annots=p.node.Annots(); if(!annots) continue;
    for(let i=0;i<annots.size();i++){ let top=annots.get(i); let d=doc.context.lookup(top);
      while(d&&d.get(PDFName.of('Parent'))){ top=d.get(PDFName.of('Parent')); d=doc.context.lookup(top); }
      const key=top.toString(); if(d&&d.get(PDFName.of('T'))&&!seen.has(key)){ seen.add(key); acro.addField(top); } } }
}
async function fetchBytes(url){ const r=await fetch(url); if(!r.ok) throw new Error('Couldn’t load '+url); return new Uint8Array(await r.arrayBuffer()); }
async function savePdf(bytes,filename){
  if(!S.downloads){ toast('Downloads aren’t available in this view. Try another browser.'); return false; }
  try{ await S.downloads.save({filename:filename.replace(/[\\/:*?"<>|]/g,'-'),data:new Blob([bytes],{type:'application/pdf'})}); toast('PDF saved'); return true; }
  catch(e){ if(e&&e.code==='declined') toast('Download cancelled'); else if(e&&e.code==='rate_limited') toast('A save prompt is already open.'); else toast('Couldn’t save the PDF ('+(e&&e.code||'error')+').'); return false; }
}

/* ---- AF 1768 eSSS ---- */
async function buildEsss(d, doc){
  const own=!doc; doc=doc||await PDFLib.PDFDocument.create(); const F=await pdfFonts(doc);
  const page=doc.addPage([PW,PH]);
  const L=['TOONE','TOONE_2','TOONE_3','TOONE_4','TOONE_5'], A=['ACTONE','ACTONE_2','ACTONE_3','ACTONE_4','ACTONE_5'], N=['SIGRDTA','SIGRDTA_3','SIGRDTA_5','SIGRDTA_7','SIGRDTA_9'];
  const R=['TOTWO','TOTWO_2','TOTWO_3','TOTWO_4','TOTWO_5'], RA=['ACTTWO','ACTTWO_2','ACTTWO_3','ACTTWO_4','ACTTWO_5'], RN=['SIGRDB','SIGRDB_3','SIGRDB_5','SIGRDB_7','SIGRDB_9'];
  const v={SUBJECT:d.subject,SURNAME:d.surname,SYMBOL:d.symbol,PHONE:d.phone,FIELD1:d.typist,CalDt:ymd8(d.suspense),CalDtB:ymd8(d.created),SUMMARY:d.summary};
  d.routing.forEach((r,i)=>{ if(i<5){v[L[i]]=r.to;v[A[i]]=r.action;v[N[i]]=r.name;} else {v[R[i-5]]=r.to;v[RA[i-5]]=r.action;v[RN[i-5]]=r.name;} });
  // summary may overflow: split onto continuation pages
  const sumIt=SPEC_1768.pages[0].items.find(i=>i.k==='SUMMARY'); const sz=9.5;
  const lines=wrapText(d.summary,F.h,sz,(sumIt.w-4)*0.97); const per=Math.floor(sumIt.h/(sz*1.17));
  v.SUMMARY=lines.slice(0,per).join('\n');
  drawSpecPage(doc,page,SPEC_1768.pages[0],{...v,SUMMARY:lines.length<=per?clean(d.summary):lines.slice(0,per).join('\n')},F,'eSSS_');
  let rest=lines.slice(per); let pn=1;
  while(rest.length){ const p=doc.addPage([PW,PH]); pn++; p.drawText('STAFF SUMMARY SHEET (CONTINUED) · '+clean(d.subject).slice(0,80),{x:40,y:PH-40,size:8,font:F.hb}); const n=Math.floor((PH-100)/(sz*1.17)); tf(doc,p,F.h,'eSSS_SUMMARY_p'+pn,40,54,PW-80,PH-100,rest.slice(0,n).join('\n'),{multi:true,size:sz}); rest=rest.slice(n); }
  return own? await doc.save() : doc;
}

async function buildForm99(d,opt={}){
  const doc=await PDFLib.PDFDocument.load(await fetchBytes('form99.pdf'));
  const form=doc.getForm();
  const map={'NAME Last First MI':d.name,'MERIT LISTS':d.merit,'START Date  TimeRow1':d.start,'RETURN Date  TimeRow1':d.ret,'TAKEN':d.taken,'AUTHORIZED':d.authorized,'ADDRESSRow1':d.address,'PHONERow1':d.phone,'OTHER CADETS':d.others,
    'DATESRow1':d.carDates,'MAKERow1':d.make,'YEARRow1':d.year,'COLORRow1':d.color,'LICENSE NUMBERRow1':d.plate,'STATERow1':d.state,'OWNERRow1':d.owner,'STATERow1_2':d.state,'OWNERRow1_2':d.owner,
    'FLIGHT NUMBERRow1':d.depFlight,'AIRLINERow1':d.depAirline,'DATE  TIMERow1':d.depTime,'FLIGHT NUMBERRow1_2':d.arrFlight,'AIRLINERow1_2':d.arrAirline,'DATE  TIMERow1_2':d.arrTime};
  const multi=new Set(['START Date  TimeRow1','RETURN Date  TimeRow1','ADDRESSRow1','PHONERow1','OTHER CADETS','TAKEN','AUTHORIZED']);
  if(opt.flat){ // draw values straight onto the page and drop the text boxes, so the copy merges cleanly into a combined PDF
    const font=await doc.embedFont(PDFLib.StandardFonts.Helvetica); const pages=doc.getPages();
    for(const k in map){ let f; try{ f=form.getTextField(k); }catch(e){ continue; } const v=clean(map[k]||''); const widgets=f.acroField.getWidgets();
      for(const pg of pages){ const an=pg.node.Annots(); if(!an) continue;
        for(let i=an.size()-1;i>=0;i--){ const wd=doc.context.lookup(an.get(i)); const w=widgets.find(x=>x.dict===wd); if(!w) continue;
          if(v){ const r=w.getRectangle(); const sz=multi.has(k)?8.5:10; const lines=wrapText(v,font,sz,r.width-4); let y=multi.has(k)?r.y+r.height-sz-2:r.y+(r.height-sz)/2+1;

<script>
/* ================= OCONUS TRAVEL PACKAGE ================= */
// OCONUS package deadlines: set each year in Admin → Site settings. Until someone does, the usual dates roll forward to the next year.
const nextOn=md=>{ const t=today(); const y=+t.slice(0,4); return (y+'-'+md)>=t?(y+'-'+md):((y+1)+'-'+md); };
const OC_DEADLINES={ get thanks(){ const s=(D('config/settings')||{}).oconus||{}; return ['Thanksgiving Break',s.thanks||nextOn('11-03')]; },
  get winter(){ const s=(D('config/settings')||{}).oconus||{}; return ['Winter Break',s.winter||nextOn('11-23')]; }, other:['Other leave',''] };
const OC_FILES={advisory:[],apacs:[]}; // uploaded screenshots live in memory only
const OC_ORDER=['eSSS','Form 99','Itinerary','Travel advisories','Foreign Clearance Guide','APACS confirmation','Force Protection & Emergency Plan'];
function ocDefaults(){ return {cadet:'',cls:'C4C',year:clsToYear('C4C'),flight:'A',phone:'',homePhone:'',email:'',workPhone:'',brk:'winter',depart:'',ret:'',travelers:'1',companions:'',purpose:'leave',poc:'',background:'',ecName:'',ecRel:'',ecPhone:'',missing:'',
  countries:[{name:'',arrive:'',depart:'',level:'1',hotel:'',hotelPhone:'',embPhone:'',embAddr:'',step:'yes',apacs:'no',fcg1:'',fcg4:''}],
  legs:[{when:'',from:'',to:'',mode:'Flight',carrier:'',num:'',notes:'',out:true,home:false}],
  summary:'',summaryEdited:false,subject:'',subjectEdited:false,routing:[],created:today()}; }
const OC=()=>{ const o=B.oconus||(B.oconus=ocDefaults()); if(!o.routing||!o.routing.length) o.routing=ocRouting(o); return o; };
const ocHigh=o=>o.countries.filter(c=>+c.level>=3);
const ocPlaces=o=>o.countries.map(c=>c.name.trim()).filter(Boolean);
function ocRouting(o){ const rows=routingFor(o); if(ocHigh(o).length){ const i=rows.findIndex(r=>/CC$/.test(r.to)&&r.action==='Approve'); if(i>=0) rows[i]={...rows[i],action:'Coord'}; rows[6]={to:'',action:'Approve',name:'Col Habben'}; } return rows; }
function ocFileBase(o){ const {first,last}=firstLast(o.cadet||''); return `${ddmmm(o.depart)}-${ddmmm(o.ret)}_${ocPlaces(o).join(', ')||'Location'}_${o.cls} ${last||'Last'}, ${first||'First'}`; }
function ocSummary(o){
  const {first,last}=firstLast(o.cadet||'[Your Name]'); const places=ocPlaces(o); const list=places.length>1?places.slice(0,-1).join(', ')+' and '+places.slice(-1):places[0]||'[countries]';
  const p=[];
  p.push(`1.  PURPOSE: The purpose of this staff summary sheet is to request permission to travel OCONUS to ${list} from ${o.depart?fmtDate(o.depart):'[start date]'} to ${o.ret?fmtDate(o.ret):'[end date]'}.`);
  p.push(`2.  BACKGROUND: ${o.background||'[Who, what, when, where and why: who you are traveling with and the reason for the trip.]'}`);
  const legsOut=o.legs.find(l=>l.out), legsHome=o.legs.find(l=>l.home);
  let disc='3.  DISCUSSION: '+(legsOut&&legsOut.when?`I will depart the United States on ${legsOut.when}${legsOut.carrier?' on '+legsOut.carrier+' '+(legsOut.num||''):''}. `:'')+'My travel in chronological order:';
  o.countries.forEach((c,i)=>{ disc+=`\nCountry #${i+1}: ${c.name||'[country]'}\nArrival: ${c.arrive?fmtDate(c.arrive):'[date]'}\nDeparture: ${c.depart?fmtDate(c.depart):'[date]'}\nLodging: ${c.hotel||'[hotel name and address]'}${c.hotelPhone?' ('+c.hotelPhone+')':''}`; });
  disc+=`\n${legsHome&&legsHome.when?`I will return to the United States on ${legsHome.when}${legsHome.carrier?' on '+legsHome.carrier+' '+(legsHome.num||''):''}. `:''}My emergency contact is ${o.ecRel?'my '+o.ecRel+', ':''}${o.ecName||'[name]'}, ${o.ecPhone||'[phone]'}. I can be reached at ${o.phone||'[your cell]'}${o.email?' or '+o.email:''}.`;
  p.push(disc);
  const lv=o.countries.filter(c=>c.name).map(c=>`${c.name} is currently a Level ${c.level} travel advisory.`).join(' ');
  p.push(`4.  CONSIDERATIONS: ${lv||'[Travel advisory level for each country.]'} ${o.missing?`I understand I will miss the following mandatory events: ${o.missing}. `:''}If anything should come up, I will contact my chain of command to ensure that pertinent information reaches the Squadron Commander.`);
  p.push(`5.  RECOMMENDATION: ${ocHigh(o).length?'Sq/CC coordination and approval by Col Habben.':'Sq/CC Approval.'}`);
  p.push(`//SIGNED//\n${first.toUpperCase()} ${last.toUpperCase()}, ${o.cls}, USAF\nAFCW/CS12`);
  return p.join('\n\n');
}

async function ocImagesPdf(list,title){
  const doc=await PDFLib.PDFDocument.create(); const F=await pdfFonts(doc);
  for(const im of list){
    let img; try{ img=/png/i.test(im.type)?await doc.embedPng(im.bytes):await doc.embedJpg(im.bytes); }catch(e){ const j=await toJpeg(im.bytes,im.type); img=await doc.embedJpg(j); }
    const page=doc.addPage([PW,PH]); page.drawText(clean(`${title}${im.label?' - '+im.label:''}`),{x:36,y:PH-40,size:11,font:F.hb});
    const s=Math.min(540/img.width,690/img.height,1.5); const w=img.width*s, hh=img.height*s; page.drawImage(img,{x:(PW-w)/2,y:PH-56-hh,width:w,height:hh});
  }
  return doc;
}
async function toJpeg(bytes,type){ const bmp=await createImageBitmap(new Blob([bytes],{type})); const c=document.createElement('canvas'); c.width=bmp.width; c.height=bmp.height; c.getContext('2d').drawImage(bmp,0,0); const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.9)); return new Uint8Array(await b.arrayBuffer()); }
const xesc=s=>clean(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function wRun(t,o={}){ const pr=`<w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman"/>${o.b?'<w:b/>':''}${o.hl?'<w:highlight w:val="yellow"/>':''}<w:sz w:val="${(o.sz||12)*2}"/></w:rPr>`; return String(t).split('\n').map((ln,i)=>`<w:r>${pr}${i?'<w:br/>':''}<w:t xml:space="preserve">${xesc(ln)}</w:t></w:r>`).join(''); }
function wPara(t,o={}){ // ==text== becomes highlighted
  const parts=String(t||'').split(/(==[\s\S]+?==)/g).filter(x=>x!=='').map(x=>/^==[\s\S]+==$/.test(x)?wRun(x.slice(2,-2),{...o,hl:true}):wRun(x,o));
  return `<w:p>${o.center?'<w:pPr><w:jc w:val="center"/></w:pPr>':''}${parts.join('')||wRun('')}</w:p>`; }
function wTable(rows){ const cell=(t,b)=>`<w:tc><w:tcPr><w:tcW w:w="0" w:type="auto"/></w:tcPr>${wPara(t,{b,sz:10})}</w:tc>`;
  return `<w:tbl><w:tblPr><w:tblStyle w:val="TableGrid"/><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${['top','left','bottom','right','insideH','insideV'].map(s=>`<w:${s} w:val="single" w:sz="4" w:space="0" w:color="000000"/>`).join('')}</w:tblBorders></w:tblPr>${rows.map((r,i)=>`<w:tr>${r.map(c=>cell(c,i===0)).join('')}</w:tr>`).join('')}</w:tbl>`; }
async function makeDocx(body){
  const zip=new JSZip();
  zip.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  zip.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file('word/document.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>`);
  return await zip.generateAsync({type:'uint8array'});
}
async function ocItineraryDocx(o){
  const b=[wPara('Itinerary',{b:true,sz:16,center:true}),wPara(`${o.cls} ${flOf(o.cadet)}  ·  ${o.depart?fmtDate(o.depart):''} to ${o.ret?fmtDate(o.ret):''}  ·  ${ocPlaces(o).join(', ')}`,{center:true}),wPara(''),

    wPara('Lodging',{b:true}),
    wTable([['Country','Arrive','Depart','Lodging name / address','Phone'],...o.countries.filter(c=>c.name).map(c=>[c.name,c.arrive?fmtShort(c.arrive):'',c.depart?fmtShort(c.depart):'',c.hotel,c.hotelPhone])]),wPara(''),
    wPara('Emergency contact',{b:true}),wPara(`${o.ecName}${o.ecRel?' ('+o.ecRel+')':''}, ${o.ecPhone}`),wPara(`Traveler cell: ${o.phone}${o.email?'  ·  Email while OCONUS: '+o.email:''}`),

async function ocFcgDocx(o){
  const b=[wPara('DoD Foreign Clearance Guide: Sections I and IV',{b:true,sz:14,center:true}),wPara(`${o.cls} ${flOf(o.cadet)}  ·  ${ocPlaces(o).join(', ')}`,{center:true}),wPara('Highlighted text marks requirements that could restrict this trip.',{sz:10,center:true}),wPara('')];

async function ocFpPlan(o,c){

  set('Text22',c.hotel); set('Text23',c.hotelPhone); set('Text24',o.purpose==='sponsored'?o.poc:''); set('Text26',c.embPhone); set('Text25',c.embAddr);

  return buildEsss({subject:o.subject,surname:`${o.cls} ${lastFirst(o.cadet)}`,symbol:'AFCW/CS12',phone:o.phone,typist,suspense:o.depart,created:o.created,summary:o.summary,routing:o.routing},null); }

async function ocAllFiles(o){
  const files=[]; const pdf=async(d)=>await (d.save?d.save():d);
  files.push({name:`1 eSSS - ${ocFileBase(o)}.pdf`,bytes:await ocEsss(o),mime:'application/pdf',desc:'Staff Summary Sheet'});

  files.push({name:'5 Foreign Clearance Guide Sections I and IV.docx',bytes:await ocFcgDocx(o),mime:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',desc:'FCG Section I and IV with restrictions highlighted'});
  if(OC_FILES.apacs.length) files.push({name:'6 APACS Confirmation.pdf',bytes:await pdf(await ocImagesPdf(OC_FILES.apacs,'APACS submission')),mime:'application/pdf',desc:'APACS request confirmation'});
  for(const [i,c] of o.countries.filter(c=>c.name).entries()) files.push({name:`7.${i+1} FP and Emergency Plan - ${c.name}.pdf`,bytes:await pdf(await ocFpPlan(o,c)),mime:'application/pdf',desc:'Individual Force Protection / Emergency Plan for '+c.name});

async function buildPortfolio(files,o){
  const {PDFName,PDFString,PDFHexString,PDFNumber,PDFBool}=PDFLib;
  const doc=await PDFLib.PDFDocument.create(); const F=await pdfFonts(doc); const ctx=doc.context;
  const page=doc.addPage([PW,PH]); let y=90; const T=(t,sz=11,f=F.h)=>{ wrapText(t,f,sz,PW-144).forEach(ln=>{ page.drawText(ln,{x:72,y:PH-y,size:sz,font:f}); y+=sz*1.35; }); };
  T('OCONUS Travel Package',20,F.hb); y+=6; T(ocFileBase(o),12,F.h); y+=10;
  T('This is a PDF Portfolio. Open it in Adobe Acrobat or Adobe Reader to see each document.',11,F.hi); y+=8;
  files.forEach(f=>T('•  '+f.name.replace(/\.(pdf|docx)$/,''),11));
  const now=new Date(); const arr=[]; const keys=[];
  files.forEach((f,i)=>{
    const key=String(i).padStart(2,'0')+' '+f.name; keys.push(key);
    const ps=ctx.obj({}); ps.set(PDFName.of('Size'),PDFNumber.of(f.bytes.length)); ps.set(PDFName.of('ModDate'),PDFString.fromDate(now)); ps.set(PDFName.of('CreationDate'),PDFString.fromDate(now));
    const st=ctx.flateStream(f.bytes,{}); st.dict.set(PDFName.of('Type'),PDFName.of('EmbeddedFile')); st.dict.set(PDFName.of('Subtype'),PDFName.of(f.mime)); st.dict.set(PDFName.of('Params'),ps);
    const sref=ctx.register(st);
    const ef=ctx.obj({}); ef.set(PDFName.of('F'),sref); ef.set(PDFName.of('UF'),sref);
    const ci=ctx.obj({}); ci.set(PDFName.of('adobe:Order'),PDFNumber.of(i));
    const spec=ctx.obj({}); spec.set(PDFName.of('Type'),PDFName.of('Filespec')); spec.set(PDFName.of('F'),PDFString.of(clean(f.name))); spec.set(PDFName.of('UF'),PDFHexString.fromText(f.name));
    spec.set(PDFName.of('EF'),ef); spec.set(PDFName.of('Desc'),PDFHexString.fromText(f.desc||'')); spec.set(PDFName.of('CI'),ci); spec.set(PDFName.of('AFRelationship'),PDFName.of('Unspecified'));
    arr.push(PDFHexString.fromText(key),ctx.register(spec));
  });
  const tree=ctx.obj({}); tree.set(PDFName.of('Names'),ctx.obj(arr));
  const names=ctx.obj({}); names.set(PDFName.of('EmbeddedFiles'),ctx.register(tree)); doc.catalog.set(PDFName.of('Names'),names);
  const fieldDef=(sub,n,o,e)=>{ const d=ctx.obj({}); d.set(PDFName.of('Type'),PDFName.of('CollectionField')); d.set(PDFName.of('Subtype'),PDFName.of(sub)); d.set(PDFName.of('N'),PDFString.of(n)); d.set(PDFName.of('O'),PDFNumber.of(o)); if(e) d.set(PDFName.of('E'),PDFBool.True); return d; };
  const schema=ctx.obj({}); schema.set(PDFName.of('Type'),PDFName.of('CollectionSchema'));
  schema.set(PDFName.of('FileName'),fieldDef('F','Name',0,true)); schema.set(PDFName.of('Description'),fieldDef('Desc','Description',1,true)); schema.set(PDFName.of('ModDate'),fieldDef('ModDate','Modified',2)); schema.set(PDFName.of('Size'),fieldDef('Size','Size',3)); schema.set(PDFName.of('adobe:Order'),fieldDef('N','Order',4));
  const sort=ctx.obj({}); sort.set(PDFName.of('Type'),PDFName.of('CollectionSort')); sort.set(PDFName.of('S'),ctx.obj([PDFName.of('adobe:Order'),PDFName.of('FileName')])); sort.set(PDFName.of('A'),PDFBool.True);
  const col=ctx.obj({}); col.set(PDFName.of('Type'),PDFName.of('Collection')); col.set(PDFName.of('View'),PDFName.of('T')); col.set(PDFName.of('D'),PDFHexString.fromText(keys[0])); col.set(PDFName.of('Schema'),schema); col.set(PDFName.of('Sort'),sort); col.set(PDFName.of('Reorder'),PDFName.of('adobe:Order'));
  doc.catalog.set(PDFName.of('Collection'),col);
  doc.setTitle(ocFileBase(o));
  return await doc.save();
}
async function saveAny(bytes,filename){
  if(!S.downloads){ toast('Downloads aren’t available in this view. Try another browser.'); return false; }

<script>
/* ================= MY SQUADRON (personal) ================= */
const stripCls=n=>String(n||'').replace(/^\s*C[1-4]C\s+/i,'').replace(/^(C\/)?(Maj|Capt|Lt Col|1Lt|2Lt|MSgt|TSgt|SSgt|SMSgt|CMSgt|Amn|Col)\.?\s+/i,'').trim();
function sameName(a,b){ a=norm(typeof flOf==='function'?flOf(stripCls(a)):stripCls(a)); b=norm(typeof flOf==='function'?flOf(stripCls(b)):stripCls(b)); if(!a||!b) return false; if(a===b) return true; const pa=a.split(' '), pb=b.split(' '); return pa[pa.length-1]===pb[pb.length-1]&&pa[0][0]===pb[0][0]; }
async function saveMyDraft(kind,title,data){ // personal copy of every document someone downloads (private to them)
  if(!S.db||!S.uid) return; try{ await S.db.doc(`data/users/${S.uid}/draft_${uid()}`).set({kind,title:String(title||kind).slice(0,160),data:JSON.parse(JSON.stringify(data)),created:new Date().toISOString()}); }catch(e){ console.warn('draft copy',e); }
}
async function sendDiscipline(kind,rec){ // Form 10 / AF 174 notice: only staff (Editors) can read these
  if(!S.db||!S.uid) return; const id=uid(); const item={...rec,kind,from:myName()||'',status:'Submitted',created:new Date().toISOString()};
  const ref=S.db.doc('discipline/'+S.uid);
  try{ await ref.update({items:{[id]:item}}); }catch(e){ try{ await ref.set({items:{[id]:item}}); }catch(e2){ console.warn(e2); toast('Couldn’t notify the First Sergeant. Let them know in Teams.'); return; } }
  toast('First Sergeant notified');
}
function myName(){ const p=(S.mine||[]).find(d=>d.id==='profile'); return p&&p.name||''; }
// heads-up for the chain of command when someone downloads routed paperwork (opt-in from the builders)
async function sendHeadsUp(kind,from,subject,routing,extra='',suspense=''){
  if(!S.db) return; const names=routing.map(r=>r.name).filter(Boolean);
  if(!names.length) return;
  await setDoc('headsup/'+uid(),{kind,from,subject,extra,suspense:suspense||'',routing:names,signed:{},status:'Active',created:new Date().toISOString(),by:S.uid||null});
}
function cqDateFor(w,col){ const yr=new Date().getFullYear(); const lbl=col<4?w.label:w.weLabel; const m=(lbl||'').match(/(\d{1,2})\/(\d{1,2})/); if(!m) return null; const d=new Date(yr,+m[1]-1,+m[2],12); d.setDate(d.getDate()+(col<4?col:col-4)); return iso(d); }
function myCq(name){ const q=D('cq/board'); if(!q) return []; const fill=q.fill||{}; const nick=[...q.c28,...q.c29].find(p=>sameName(p.name,name)); const out=[];
  q.weeks.forEach(w=>w.rows.forEach(r=>r.slots.forEach((sl,col)=>{ const v=fill[sl.id]; if(!v) return; if(!(sameName(v,name)||(nick&&nick.nick&&norm(v)===norm(nick.nick)))) return; const d=cqDateFor(w,col); out.push({date:d,day:w.days[col],time:col<4?r.wd:r.we}); })));
  return out.filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date)); }
function mySdo(name){ const s=D('sdo/schedule'); if(!s) return []; return Object.entries(s.days).filter(([,n])=>sameName(n,name)).map(([d])=>d).sort(); }
// find someone on the tasker board even when the spelling differs a little from the roster (Rodgers / Rogers)
function editDist(a,b){ a=a||''; b=b||''; const m=a.length,n=b.length; if(Math.abs(m-n)>2) return 9; let prev=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
function tkPersonFor(name){ const tk=D('taskers/board'); if(!tk) return null; const all=[]; tk.groups.forEach(g=>g.people.forEach(x=>all.push(x)));
  let p=all.find(x=>norm(x.name)===norm(name))||all.find(x=>sameName(x.name,name)); if(p) return p;
  const me=nameParts(name); const close=all.filter(x=>{ const o=nameParts(x.name); return norm(o.first)===norm(me.first)&&editDist(norm(o.last),norm(me.last))<=2; });
  return close.length===1?close[0]:null; }
// every tasker assigned to this person, done or not (done = "Yes")
function myTaskerList(name){ const tk=D('taskers/board'); const p=tkPersonFor(name); if(!tk||!p) return null;
  return tk.columns.map(c=>({c,pid:p.id,v:(tk.status[p.id]||{})[c.id]||''})).filter(x=>x.v).map(x=>({...x,done:/^yes/i.test(x.v)})); }
function myTaskers(name){ const l=myTaskerList(name); return l===null?null:l.filter(x=>!x.done); }
// Flight commanders / flight chiefs and division chiefs see their people
function leaderScope(name){
  const me=allPeople().filter(p=>sameName(p.name,name));
  for(const p of me){
    if(/Flight$/.test(p.section)&&/^(Flight Commander|Assistant Flight Commander|Flight Chief)$/.test((p.pos||'').trim())){ const sec=D('roster/main').sections.find(s=>s.name===p.section); return {label:p.section,kind:'flight',names:sec.people.map(x=>x.name),group:p.section}; }
    const m=(p.pos||'').match(/Squadron (A1|A2|A3|A4\/A6) Division Chief/); if(m){ const re=new RegExp('Squadron '+m[1].replace('/','\\/')+' (Staff|Division Chief)'); return {label:m[1]+' division',kind:'div',names:allPeople().filter(x=>re.test(x.pos||'')).map(x=>x.name)}; }
    if(/Standardization\/Evaluation Officer/.test(p.pos||'')) return {label:'Stan/Eval',kind:'div',names:allPeople().filter(x=>/Standardization/.test(x.pos||'')).map(x=>x.name)};
  }
  return null;
}
function leaderPanel(name){

    const now=new Date(); let d=new Date(now.getFullYear(),MON_IDX[m[2].slice(0,3).toLowerCase()],+m[1],12);
    const diff=(d-now)/864e5; if(diff>180) d.setFullYear(d.getFullYear()-1); if(diff<-180) d.setFullYear(d.getFullYear()+1);
    if(!isNaN(d)) start=sundayOf(d);

}

<script>
/* ================= PASTE FROM EXCEL =================
   Copying cells in Excel (or Google Sheets / Numbers) puts them on the clipboard as tab-separated text.
   These tools read that text, show a preview, and save it: the weekly outlook on the Dozen Daily and the SDO schedule. */
function parseTSV(text){
  text=String(text||'').replace(/\r\n?/g,'\n'); const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; continue; }
    if(ch==='"'&&cell==='') { q=true; continue; }
    if(ch==='\t'){ row.push(cell); cell=''; continue; }
    if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; continue; }
    cell+=ch; }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.map(r=>r.map(c=>c.replace(/ /g,' ').trim()));
}
const DAYS_RE=/^(sun|mon|tue|wed|thu|fri|sat)[a-z]*\b/i;
const ASTAFF_TAG=/^\((A1|A2|A3|A4\/A?6|Stan\/Eval|C&H)\)/i;
// Turns a pasted block into the outlook: a header row with the weekday names, then rows. A label in the first
// column starts a row (All, Step Brief, MISC, 2027...); rows with a blank label add lines to the row above.
function outlookFromPaste(grid,cur){
  const note=[]; grid=grid.filter(r=>r.some(c=>c));
  if(!grid.length) return {err:'Nothing to read. Copy the cells in Excel, then paste here.'};
  let hi=grid.findIndex(r=>r.filter(c=>DAYS_RE.test(c)).length>=3);
  const days=(cur.days&&cur.days.length===7?cur.days:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']).slice();
  let cols=null, title=null, quote=null;
  if(hi>=0){
    const hdr=grid[hi]; cols=Array(7).fill(-1);
    hdr.forEach((c,ci)=>{ const m=DAYS_RE.exec(c); if(!m) return; const idx=['sun','mon','tue','wed','thu','fri','sat'].indexOf(m[1].toLowerCase()); if(idx>=0&&cols[idx]<0){ cols[idx]=ci; days[idx]=c; } });
    grid.slice(0,hi).forEach(r=>{ const t=r.find(c=>/outlook|week/i.test(c)); if(t&&!title) title=t; });
  } else { cols=[1,2,3,4,5,6,7]; note.push('No row of weekday names found, so the first column is read as labels and the next 7 as Sunday–Saturday.'); }
  const firstDayCol=Math.min(...cols.filter(c=>c>=0));
  let body=grid.slice(hi+1);
  // calendar style: a row like "1 (M10)" under the weekday names adds the day code ("Tuesday: M10")
  if(body.length&&cols.some(c=>c>=0&&/^\d{1,2}\s*\(([A-Z]\d+)\)\s*$/.test(body[0][c]||''))){
    cols.forEach((c,i)=>{ const m=/^\d{1,2}\s*\(([A-Z]\d+)\)/.exec(body[0][c]||''); if(m) days[i]=days[i].replace(/:.*$/,'')+': '+m[1]; }); body=body.slice(1); }
  const rows=[]; let skipped=0;
  body.forEach(r=>{
    const label=(firstDayCol>0?r.slice(0,firstDayCol).find(c=>c):'')||'';
    if(/^quote/i.test(label)){ quote=cols.map(c=>c>=0?r[c]||'':'').filter(Boolean).join(' ')||r.slice(1).find(c=>c)||''; return; }
    const cells=cols.map(c=>{ const v=c>=0?(r[c]||''):''; const ls=v.split('\n').filter(x=>{ if(ASTAFF_TAG.test(x.trim())){ skipped++; return false; } return true; }); return ls.join('\n').trim(); });
    if(label||!rows.length) rows.push({label:label||'All',cells});
    else { const last=rows[rows.length-1]; cells.forEach((v,i)=>{ if(v) last.cells[i]=last.cells[i]?last.cells[i]+'\n'+v:v; }); }
  });
  if(skipped) note.push(`${skipped} A-staff item${skipped===1?'':'s'} left out: those come from the A-staff preflight schedule.`);
  if(!rows.length) return {err:'Found the weekday names but no rows under them.'};

}

        const ok=await mutDoc('config/site',s=>{ s.outlook={title,quote,days:r.days.map(d=>d.slice(0,40)),rows:r.rows.slice(0,20).map(x=>({label:x.label.slice(0,40),cells:x.cells.map(c=>c.slice(0,1500))})),updated:new Date().toISOString(),updatedBy:myName()||''}; return s; });
        if(ok){ S.edit.paste=null; toast('Week updated'); render(); } }},'Save this week'))):null);

/* ---------- SDO schedule: paste two columns, date and name ---------- */
function parseDay(s){ s=String(s||'').trim(); if(!s) return null; let m;
  if((m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s))) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if((m=/^(\d{4})(\d{2})(\d{2})$/.exec(s))) return `${m[1]}-${m[2]}-${m[3]}`;
  const yr=new Date().getFullYear();
  if((m=/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/.exec(s))){ const y=m[3]?(m[3].length===2?'20'+m[3]:m[3]):yr; return `${y}-${pad(+m[1])}-${pad(+m[2])}`; }
  if((m=/^(?:[A-Za-z]+,?\s+)?(\d{1,2})[\s-]*([A-Za-z]{3,})\.?[\s-]*(\d{2,4})?$/.exec(s))&&MON_IDX[m[2].slice(0,3).toLowerCase()]!==undefined){ const y=m[3]?(m[3].length===2?'20'+m[3]:m[3]):yr; return `${y}-${pad(MON_IDX[m[2].slice(0,3).toLowerCase()]+1)}-${pad(+m[1])}`; }
  if((m=/^(?:[A-Za-z]+,?\s+)?([A-Za-z]{3,})\.?\s+(\d{1,2})(?:,?\s+(\d{4}))?$/.exec(s))&&MON_IDX[m[1].slice(0,3).toLowerCase()]!==undefined){ const y=m[3]||yr; return `${y}-${pad(MON_IDX[m[1].slice(0,3).toLowerCase()]+1)}-${pad(+m[2])}`; }
  return null; }
function sdoPasteBox(){
  const st=S.edit.sdoPaste||(S.edit.sdoPaste={open:false,text:'',rows:null,bad:0});
  if(!st.open) return h('button',{class:'btn sm',style:'margin-top:10px',onclick:()=>{ st.open=true; render(); }},'Paste SDOs from Excel');
  const read=()=>{ const g=parseTSV(st.text).filter(r=>r.some(Boolean)); const rows=[]; let bad=0;
    g.forEach((r,i)=>{ const d=parseDay(r[0]); const n=(r.slice(1).find(Boolean)||'').slice(0,60); if(d&&!isNaN(new Date(d+'T12:00'))) rows.push({d,n}); else if(r[0]&&!(i===0&&/^\s*(date|day)s?\s*$/i.test(r[0]))) bad++; });
    st.rows=rows; st.bad=bad; render(); };
  return h('div',{class:'box',style:'margin-top:10px'},h('b',null,'Paste SDOs from Excel'),
    h('p',{class:'small muted',style:'margin:4px 0 6px'},'Copy two columns, date then name (any date style: 11/3, 3 Nov, 2026-11-03), and paste. A blank name clears that day.'),
    h('textarea',{id:'sdopaste',rows:5,value:st.text,oninput:e=>st.text=e.target.value,onpaste:()=>setTimeout(()=>{ st.text=$('#sdopaste').value; read(); },0)},st.text),
    st.rows?h('p',{class:'small',style:'margin:6px 0'},`${st.rows.length} day${st.rows.length===1?'':'s'} read`+(st.bad?` · ${st.bad} line${st.bad===1?'':'s'} skipped (date not recognized)`:'')+(st.rows.length?`: ${fmtShort(st.rows[0].d)} to ${fmtShort(st.rows[st.rows.length-1].d)}`:'')):null,
    h('div',{class:'row'},h('button',{class:'btn',onclick:read},'Preview'),

<script>
/* ================= eSSS TRACKER =================
   Who is leaving on an eSSS (or OCONUS package) and when. Filled automatically when someone downloads one (unless they
   untick it or mark it a practice run); staff can add one done outside the site. The Exec sees a calendar;
   flight commanders and division chiefs see their people. Other ways of signing out aren't tracked here. */

// Which chain someone belongs to. A flight's own roster section wins; otherwise their staff section decides
// (A-staff division, Stan/Eval, Squadron/Special Staff, Group/Wing). The spreadsheet's "Flight" column only
// counts for people who aren't in any section that has a chain.
function unitOf(name){
  const ents=allPeople().filter(p=>sameName(p.name,name)); if(!ents.length) return {kind:'',key:'',label:''};
  const fl=ents.find(p=>flightRe(true).test(p.section||''));
  if(fl){ const k=fl.section.split(' ')[0]; return {kind:'flight',key:k,label:k+' Flight'}; }
  for(const p of ents){ const pos=(p.pos||'').trim(), sec=p.section||'';
    if(/Command Staff/.test(sec)) return {kind:'cmd',key:'SQ',label:'Squadron Staff'};
    const a=pos.match(/^Squadron (A1|A2|A3|A4\/A6)\b/); if(a) { const k=a[1].replace('A4/A6','A4/6'); return {kind:'div',key:k,label:k+' division'}; }
    if(/Stan\/Eval/.test(sec)||/Standardization/.test(pos)) return {kind:'div',key:'Stan/Eval',label:'Stan/Eval'};
    if(/A-Staff/.test(sec)) return {kind:'div',key:'A-Staff',label:'A-Staff'};
    if(/Special Staff/.test(sec)) return {kind:'special',key:'SQ',label:'Squadron Special Staff'};
    if(/Group\/Wing/.test(sec)) return {kind:'gw',key:'GW',label:'Group/Wing Staff'};
  }
  const f=((ents[0].flight||'')+' ').match(flightRe()); if(f) return {kind:'flight',key:f[0],label:f[0]+' Flight'};
  return {kind:'',key:'',label:''};
}
// what the roster shows: the person's chain, plus their staff job when they also hold a flight job
function chainLabel(name){ const u=unitOf(name); if(!u.kind) return '—';
  if(u.kind!=='flight') return u.label;
  const staff=allPeople().filter(p=>sameName(p.name,name)).map(p=>{ const m=(p.pos||'').match(/^Squadron (A1|A2|A3|A4\/A6)\b/); return m?m[1].replace('A4/A6','A4/6'):/Standardization/.test(p.pos||'')?'Stan/Eval':''; }).filter(Boolean);
  return staff.length?`${u.label} (also ${[...new Set(staff)].join(', ')})`:u.label; }

function routeCodeOf(name){ const u=unitOf(name); return u.kind==='flight'?u.key[0]:u.kind==='div'?({'A4/6':'A46','Stan/Eval':'SE','A-Staff':'A3'}[u.key]||u.key):u.kind==='gw'?'GW':u.kind?'SQ':''; }

const SO_KINDS=['eSSS','OCONUS'];

function legacyTrips(){ const m=D('config/meta'); if(!m||m.hs2so) return []; return legacyTripsFrom(S.headsup||[]); }
function legacyTripsFrom(list){ return list.filter(x=>/eSSS|OCONUS/.test(x.kind)&&/^\d{4}-\d{2}-\d{2}$/.test(x.suspense||'')).map(x=>{
  const m=/(\d{1,2})\/(\d{1,2})\s*[–-]\s*(\d{1,2})\/(\d{1,2})\s*(.*)$/.exec(x.extra||''); let ret=x.suspense, where='';
  if(m){ const y=+x.suspense.slice(0,4); let r=new Date(y,+m[3]-1,+m[4],12); if(r<new Date(x.suspense+'T00:00')) r.setFullYear(y+1); ret=iso(r); where=m[5].trim(); } else where=x.extra||'';
  return {id:'hs_'+x.id,name:flOf(stripCls(x.from)),kind:x.kind,depart:x.suspense,ret,where,legacy:true,by:x.by}; }); }
// only trips that ended in the last 45 days (or haven't happened yet) stream in; an older month is fetched once when someone opens it
const SO_OLD={months:{},docs:{}};
function loadSignoutMonth(ym){ if(!/^\d{4}-\d{2}$/.test(ym)||SO_OLD.months[ym]||!S.db||S.nodb) return; const start=ym+'-01'; if(start>=daysAgoIso(SO_WINDOW)) return;
  SO_OLD.months[ym]='loading'; const [y,m]=ym.split('-').map(Number); const end=iso(new Date(y,m,0)); const until=iso(new Date(y,m,14));
  S.db.collection('signout',{since:start,until}).get().then(q=>{ normCol('signout',q.docs.map(d=>({id:d.id,...d.data()}))).forEach(x=>SO_OLD.docs[x.id]=x); SO_OLD.months[ym]='done'; render(); }).catch(e=>{ console.warn(e); delete SO_OLD.months[ym]; }); }
function signouts(){ const cur=S.signout||[]; const have=new Set(cur.map(x=>x.id)); const list=cur.concat(Object.values(SO_OLD.docs).filter(x=>!have.has(x.id))).filter(x=>x.name&&/^\d{4}-\d{2}-\d{2}$/.test(x.depart)).map(x=>({...x,ret:/^\d{4}-\d{2}-\d{2}$/.test(x.ret)&&x.ret>=x.depart?x.ret:x.depart}));

<script>
/* ================= FIREBASE BACKEND =================
   Connects the app to Firebase (Auth + Firestore) through one small storage API (doc / collection) that every tab uses,
   so every tab keeps working unchanged. Each record is stored as one JSON string ("j") because some
   grids hold arrays inside arrays, which Firestore can't store natively. */
const FB={ state:'loading', user:null, member:null, fs:null, auth:null };
const PUB_TABS=[];
// Nobody's personal account is built into the site. Who runs it lives on the access list itself:
//   admin  = runs the site (access list, turnover, backups, can make other admins)
//   staff  = squadron staff: edits squadron records and opens the locked tabs
//   member = everyone else in the squadron
const isStaffRole=r=>r==='staff'||r==='admin';

function fbConfigured(){ const c=window.FIREBASE_CONFIG; return !!(c&&c.apiKey&&!/PASTE/.test(c.apiKey)&&window.firebase); }
const MAX_DOC=900000;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// Saves that collide with someone else's (busy record, flaky Wi-Fi) are retried with growing, randomized waits.
async function withRetry(fn){ let last;
  for(let i=0;i<7;i++){ try{ return await fn(); }catch(e){ last=e; const c=(e&&e.code)||'';
      if(!/aborted|unavailable|deadline-exceeded|internal|cancelled|failed-precondition/.test(c)) throw e;
      await sleep(Math.min(5000,200*2**i)+Math.random()*400); } }
  throw last; }
// "own" = whoever created the record. It never changes on later edits, so the rules can tell who may delete it.
function fbPack(obj,own,path){ const j=JSON.stringify(obj); if(j.length>MAX_DOC) throw Object.assign(new Error('too big'),{code:'quota_exceeded'});
  const out={j,by:FB.user.uid,own:own===undefined?FB.user.uid:own,at:firebase.firestore.FieldValue.serverTimestamp()};
  const k=sortKeyOf(path,obj); if(k) out.k=k; return out; }
// a plain date field Firestore can filter on: an eSSS trip's return date, so only current trips are downloaded
// leader tasks and action items: 'open' or 'done', so My Squadron downloads only what's still open
function sortKeyOf(path,obj){ if(!obj) return '';
  if(/^ldrtasks\//.test(path||'')) return obj.status==='Done'?'done':'open';
  if(/^actions\//.test(path||'')) return obj.done?'done':'open';
  if(/^signout\//.test(path||'')){ const r=/^\d{4}-\d{2}-\d{2}$/.test(obj.ret||'')?obj.ret:obj.depart; return /^\d{4}-\d{2}-\d{2}$/.test(r||'')?r:''; } return ''; }
const ownOf=s=>s.exists?(s.data().own===undefined?null:s.data().own):undefined;
const fbDec=d=>{ if(!d) return null; if(typeof d.j==='string'){ try{ return JSON.parse(d.j); }catch(e){ return null; } } const {by,at,own,k,...rest}=d; return rest; };
function fbMerge(base,patch){
  const out=(base&&typeof base==='object'&&!Array.isArray(base))?{...base}:{};
  for(const k in patch){ const v=patch[k];
    if(v===null||v===undefined) delete out[k];
    else if(typeof v==='object'&&!Array.isArray(v)&&!(v instanceof Date)) out[k]=fbMerge(out[k],v);
    else out[k]=v; }

function nameFromEmail(em){ const guess=emailToName(em); if(!guess||!/^c\d{2}/i.test(String(em))) return ''; const p=allPeople().filter(x=>norm(x.name)===norm(guess)||sameName(x.name,guess));

async function fbBulkAdd(text,mems){

    const name=line.replace(m[0],'').replace(/\bstaff\b/ig,'').replace(/\bmember\b/ig,'').replace(/[<>,;"'\t]+/g,' ').replace(/\s+/g,' ').trim();
    rows.push({email,staff,name:name||nameFromEmail(email)}); });
  fbBulkAdd.skipped=bad.length;
  if(bad.length&&!rows.length) toast(`No emails found in ${bad.length} line${bad.length===1?'':'s'}.`);

      b.set(FB.fs.doc('members/'+r.email),doc); b.delete(FB.fs.doc('requests/'+r.email)); n++; if(++k>=200){ await b.commit(); b=FB.fs.batch(); k=0; } }
    if(k) await b.commit();

  for(const p of paths){ if(p.split('/').length%2) continue; b.set(FB.fs.doc(p),fbPack(data[p],null,p)); n++; if(++inBatch>=200){ await b.commit(); b=FB.fs.batch(); inBatch=0; } }
  if(inBatch) await b.commit(); return n; }

const _appBoot=boot;

  FB.auth.onAuthStateChanged(async u=>{
    if(started){ if(!u||u.uid!==FB.user.uid) location.reload(); return; }
    FB.user=u;
    if(!u){ FB.state='out'; render(); return; }
    if(!u.emailVerified){ FB.state='verify'; S.tab='hub'; render(); return; }
    const em=(u.email||'').toLowerCase();
    // Check the access list. Right after signing in, Firestore can briefly refuse the read (the new sign-in hasn't
    // reached it yet) or the network can blip: retry with a fresh sign-in token instead of calling that "not on the list".
    FB.state='checking'; render();

      catch(e){ checkErr=e; console.warn('access check',i,e&&e.code); await sleep(Math.min(4000,300*2**i)); }
    }

      FB.fs.doc('members/'+em).onSnapshot(s=>{ if(s.exists) location.reload(); },()=>{});
      return; }

    { const key='builder:'+u.uid; const mine=ls(key); const legacy=ls('builder'); Object.keys(B).forEach(k=>delete B[k]); Object.assign(B,mine||legacy||{}); if(legacy){ try{ localStorage.removeItem('cs12:builder'); }catch(e){} if(!mine) ls(key,B); }
      bsave=function(){ clearTimeout(bsave.t); bsave.t=setTimeout(()=>ls(key,B),400); }; }

};
const FULL_TABS=TABS.slice();
/* ---------- CQ sign-ups ----------
   Each sign-up saves only its own slot in one small record (cqfill/all) instead of rewriting the whole CQ board,
   so 100 people signing up at once don't collide, and the rules stop anyone overwriting someone else's slot. */
FB.cq={}; let _cqMemo=null;
function fbStartCq(){
  S.overlay=S.overlay||{};
  S.overlay['cq/board']=doc=>{ if(_cqMemo&&_cqMemo.doc===doc&&_cqMemo.cq===FB.cq) return _cqMemo.out; const fill={...(doc.fill||{})};
    for(const k in FB.cq){ const e=FB.cq[k]; if(e&&typeof e==='object'&&typeof e.v==='string') fill[k]=e.v; }
    const out={...doc,fill}; _cqMemo={doc,cq:FB.cq,out}; return out; };
  (S.onUse=S.onUse||{})['cq/board']=()=>live('cqfill',()=>FB.fs.doc('cqfill/all').onSnapshot(s=>{ FB.cq=s.exists?(s.data()||{}):{}; fbMigrateCq(); schedule('d:cq/board'); },e=>liveErr('cqfill',e)));
}
async function cqWrite(id,v){
  if(!/^[\w-]{1,40}$/.test(id)) return;
  const prev=FB.cq[id]; if(prev&&prev.by&&prev.by!==FB.user.uid&&!S.canEdit) return toast('Someone else has that slot. Ask squadron staff to change it.');
  try{ await withRetry(()=>FB.fs.doc('cqfill/all').set({[id]:{v,by:FB.user.uid,at:Date.now()}},{merge:true})); }
  catch(e){ toast(e&&e.code==='permission-denied'?'Someone else just took that slot. Pick another one.':e&&e.code==='unavailable'?'You’re offline. Reconnect and try again.':'That didn’t save. Try again.'); }
}
/* ---------- tasker check-offs: same idea, one small entry per check-off in tkdone/all ---------- */
FB.tk={}; let _tkMemo=null;
function fbStartTk(){

  S.overlay['taskers/board']=doc=>{ if(_tkMemo&&_tkMemo.doc===doc&&_tkMemo.tk===FB.tk) return _tkMemo.out; const status={};

    const out={...doc,status}; _tkMemo={doc,tk:FB.tk,out}; return out; };
  (S.onUse=S.onUse||{})['taskers/board']=()=>live('tkdone',()=>FB.fs.doc('tkdone/all').onSnapshot(s=>{ FB.tk=s.exists?(s.data()||{}):{}; schedule('d:taskers/board'); },e=>liveErr('tkdone',e)));

async function tkWrite(pid,cid,v){

  catch(e){ toast(e&&e.code==='permission-denied'?'Only staff can change someone else’s tasker.':e&&e.code==='unavailable'?'You’re offline. Reconnect and try again.':'That didn’t save. Try again.'); }
}
// one time: move sign-ups that were saved inside the old CQ board into the new per-slot record (staff do this automatically)
let _cqMig=false;
async function fbMigrateCq(){
  if(_cqMig||!S.canEdit) return; const base=S.docs['cq/board']; if(!base||!base.fill) return;
  const keys=Object.keys(base.fill).filter(k=>base.fill[k]&&/^[\w-]{1,40}$/.test(k)); if(!keys.length) return; _cqMig=true;
  const add={}; keys.forEach(k=>{ if(!FB.cq[k]) add[k]={v:String(base.fill[k]).slice(0,60),by:'import',at:Date.now()}; });
  try{ if(Object.keys(add).length) await withRetry(()=>FB.fs.doc('cqfill/all').set(add,{merge:true}));
    await S.db.doc('cq/board').update({fill:null}); }catch(e){ console.warn('cq move',e); _cqMig=false; }
}
/* ---------- who is signed in: match the sign-in email (c27first.last@...) or the Access-list name to the roster ---------- */
function emailToName(em){ return (em||'').split('@')[0].toLowerCase().replace(/^c\d{2}/,'').split(/[._]+/).map(x=>x.replace(/\d+$/,'')).filter(Boolean).join(' '); }
function identify(){
  if(!FB.user) return null; const people=allPeople(); if(!people.length) return null;
  const key=n=>norm(stripCls(n)).replace(/[^a-z ]/g,'');
  // the same person can be listed in several sections (flight + staff job); pick their entry with a job title

  const tryName=n=>{ if(!n) return null; const k=key(n); if(!k) return null; return one(people.filter(x=>key(x.name)===k))||one(people.filter(x=>sameName(x.name,n))); };

/* ---------- staff upkeep: one-time data moves and a daily tidy of the busiest records ---------- */
async function staffUpkeep(){
  if(!S.canEdit||staffUpkeep.ran) return; staffUpkeep.ran=true;
  try{
    const metaRef=S.db.doc('config/meta'); const ms=await metaRef.get(); const meta=(ms.exists&&ms.data())||{};
    // 1) tag every eSSS trip with its return date so browsers only download current trips
    //    (and leader tasks / action items with open or done, so My Squadron only downloads open ones)
    if(!meta.soK){ for(const c of ['signout','ldrtasks','actions']){ const qs=await FB.fs.collection(c).get(); let b=FB.fs.batch(),k=0;
        for(const d of qs.docs){ const raw=d.data(); if(typeof raw.k==='string') continue; const o=fbDec(raw); if(!o) continue; b.set(d.ref,fbPack(o,raw.own===undefined?null:raw.own,c+'/'+d.id)); if(++k>=200){ await b.commit(); b=FB.fs.batch(); k=0; } }
        if(k) await b.commit(); }
      await metaRef.update({soK:true}); }
    // 2) move trips from the old paperwork notices into the eSSS tracker, so nobody downloads the old notices just for dates
    if(!meta.hs2so){ const qs=await FB.fs.collection('headsup').get(); const list=normCol('headsup',qs.docs.map(d=>({id:d.id,...fbDec(d.data())})));
      let b=FB.fs.batch(),k=0; for(const t of legacyTripsFrom(list)){ const o={name:t.name,kind:t.kind,depart:t.depart,ret:t.ret,where:t.where,unit:unitOf(t.name).label,created:new Date().toISOString(),by:t.by||null,fromNotice:t.id};
        b.set(FB.fs.doc('signout/so_'+t.id),fbPack(o,null,'signout/x')); if(++k>=200){ await b.commit(); b=FB.fs.batch(); k=0; } }
      if(k) await b.commit(); await metaRef.update({hs2so:true}); }
    // 3) once a day: drop CQ sign-ups and tasker check-offs that belong to weeks/taskers no longer on the boards,
    //    so the two busiest records stay small (every change to them is sent to everyone who has the page open)
    if(meta.pruned!==today()){ const del=firebase.firestore.FieldValue.delete;
      const cq=(await S.db.doc('cq/board').get()).data(); const ids=new Set(); ((cq&&cq.weeks)||[]).forEach(w=>((w&&w.rows)||[]).forEach(r=>((r&&r.slots)||[]).forEach(sl=>sl&&sl.id&&ids.add(sl.id))));
      if(ids.size){ const f=await FB.fs.doc('cqfill/all').get(); const gone=Object.keys((f.exists&&f.data())||{}).filter(k=>!ids.has(k)); if(gone.length) await FB.fs.doc('cqfill/all').update(Object.fromEntries(gone.map(k=>[k,del()]))); }
      const tb=(await S.db.doc('taskers/board').get()).data(); const cols=new Set(((tb&&tb.columns)||[]).map(c=>c&&c.id)); const ppl=new Set(((tb&&tb.groups)||[]).flatMap(g=>((g&&g.people)||[]).map(p=>p&&p.id)));
      if(cols.size&&ppl.size){ const f=await FB.fs.doc('tkdone/all').get(); const gone=Object.keys((f.exists&&f.data())||{}).filter(k=>{ const m=/^(.+)__(.+)$/.exec(k); return !m||!ppl.has(m[1])||!cols.has(m[2]); }); if(gone.length) await FB.fs.doc('tkdone/all').update(Object.fromEntries(gone.map(k=>[k,del()]))); }
      await metaRef.update({pruned:today()}); }
  }catch(e){ console.warn('upkeep',e); }
}
