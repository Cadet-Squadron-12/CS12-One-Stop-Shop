<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="logo.png">
<meta name="description" content="Cadet Squadron 12 hub: Dozen Daily, duty schedules, taskers, paperwork builder and A4/6 tools.">
<title>CS-12 One Stop Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<style>
/* Layout: black patch-style masthead with a red/yellow runway stripe, tab rail, one wide working column.
   Palette comes from the CS-12 patch: patch blue, black, white, runway red and yellow, flight-line grey. */
:root{
  --bg:#F1F5FB; --surface:#FFFFFF; --sunk:#E4ECF6; --line:#C9D6E8;
  --ink:#10141B; --muted:#4F5B6E;
  --navy:#0E1116; --sun:#F5C518; --coral:#D62828; --sky:#2F5FA8; --mint:#17975F; --grape:#7A5AF8;
  --patch:#9DC1E6; --patch-deep:#6F96CD; --flight:#A8B4C0;
  --sun-soft:#FDF2C4; --coral-soft:#FBE0E0; --sky-soft:#DDE9F8; --mint-soft:#D5F0E3; --grape-soft:#ECE6FE;
  --on-accent:#10141B; --cell-ink:#141414; --mast-sub:#B9C4D4; --mast-hover:#232A35;
  --display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0E13; --surface:#141920; --sunk:#1C232D; --line:#2A3441;
  --ink:#EEF2F8; --muted:#A3AFC0; --navy:#06080B; --sky:#7FA8E0;
  --sun-soft:#3A3110; --coral-soft:#3F1B1B; --sky-soft:#18273D; --mint-soft:#11352A; --grape-soft:#2C2457;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B0E13; --surface:#141920; --sunk:#1C232D; --line:#2A3441;
  --ink:#EEF2F8; --muted:#A3AFC0; --navy:#06080B; --sky:#7FA8E0;
  --sun-soft:#3A3110; --coral-soft:#3F1B1B; --sky-soft:#18273D; --mint-soft:#11352A; --grape-soft:#2C2457;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
a{color:var(--sky)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:#fff;box-shadow:0 3px 0 var(--coral),0 6px 0 var(--sun)}
.mast .top{display:flex;align-items:center;gap:14px;padding-block:12px 6px}
.mast-logo{flex:none;width:46px;height:auto;filter:drop-shadow(0 1px 0 rgba(255,255,255,.15))}
.mast h1{font-family:var(--display);font-weight:800;font-size:clamp(20px,3.2vw,28px);margin:0;letter-spacing:-.01em;line-height:1.1}
.mast .sub{font-size:12px;color:var(--mast-sub);letter-spacing:.06em;text-transform:uppercase}
.mast .who{margin-left:auto;font-size:12px;text-align:right;color:var(--mast-sub)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill.staff{background:var(--sun);color:var(--navy)}
.pill.view{background:var(--mast-hover);color:#E6EBF2}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:6px 10px;scrollbar-width:thin}
nav.tabs button{flex:none;border:0;background:transparent;color:#E6EBF2;padding:7px 12px;border-radius:999px;font-weight:600;cursor:pointer;font-size:14px}
nav.tabs button:hover{background:var(--mast-hover)}
nav.tabs button[aria-current="page"]{background:var(--sun);color:var(--navy)}
main{padding-block:22px 60px}
.banner{border-radius:var(--r);padding:12px 14px;margin-bottom:16px;border:1px solid var(--line);background:var(--surface);display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--sun-soft);border-color:transparent}
.banner.bad{background:var(--coral-soft);border-color:transparent}
.banner.info{background:var(--sky-soft);border-color:transparent}
.banner b{white-space:nowrap}
h2.pg{font-family:var(--display);font-weight:800;font-size:clamp(24px,4vw,34px);margin:0 0 4px;letter-spacing:-.015em;text-wrap:balance}
p.lede{margin:0 0 18px;color:var(--muted);max-width:68ch}
h3{font-family:var(--display);font-weight:600;font-size:19px;margin:0 0 10px;text-wrap:balance}
h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--sky);border-color:var(--sky);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--on-accent)}
.btn.danger{color:var(--coral)}
.btn.sm{padding:3px 8px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
label.f span.h{font-weight:400;color:var(--muted);font-size:12px}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=email],input[type=tel],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px 12px}
.fgrid .wide{grid-column:1/-1}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{position:sticky;top:0;background:var(--sunk);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
table.t tr.grp td{background:var(--navy);color:#fff;font-family:var(--display);font-weight:600;letter-spacing:.01em}
table.t td.num{font-variant-numeric:tabular-nums;text-align:right}
.st{display:inline-block;min-width:44px;text-align:center;border-radius:6px;padding:2px 6px;font-weight:700;font-size:12px;border:0;cursor:default}
button.st{cursor:pointer}
.st.yes{background:var(--mint-soft);color:var(--mint)}
.st.no{background:var(--coral-soft);color:var(--coral)}
.st.na{background:var(--sunk);color:var(--muted)}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}
.chip.Drafted{background:var(--sunk);color:var(--muted)}
.chip.Sent{background:var(--sun-soft);color:#9A6A00}
.chip.Approved{background:var(--mint-soft);color:var(--mint)}
.chip.Returned{background:var(--coral-soft);color:var(--coral)}
:root[data-theme="dark"] .chip.Sent{color:var(--sun)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.Sent{color:var(--sun)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi .v{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.bar{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--mint)}
/* weekly outlook */
.week{display:grid;grid-template-columns:110px repeat(7,minmax(130px,1fr));min-width:1040px}
.week>div{padding:8px 9px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-size:13px;white-space:pre-line}
.week .dh{background:var(--navy);color:#fff;font-weight:700;font-family:var(--display)}
.week .dh.today{background:var(--sun);color:var(--navy)}
.week .rl{background:var(--sunk);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.week textarea{min-height:90px;font-size:12px}
.quote{font-family:var(--display);font-weight:600;font-size:clamp(17px,2.4vw,22px);line-height:1.35;margin:0;text-wrap:balance}
.stamp{display:inline-block;transform:rotate(-2deg);background:var(--coral);color:#fff;font-family:var(--display);font-weight:800;padding:2px 10px;border-radius:6px;letter-spacing:.03em;font-size:13px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);min-width:0}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0;overflow-wrap:anywhere}
/* CQ */
.cqwk{margin-bottom:18px}
.cqgrid{display:grid;grid-template-columns:96px repeat(4,minmax(118px,1fr)) 96px repeat(3,minmax(118px,1fr));min-width:1100px;font-size:12.5px}
.cqgrid>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 6px;min-height:30px;display:flex;align-items:center}
.cqgrid .h{background:var(--navy);color:#fff;font-weight:700}
.cqgrid .tm{background:var(--sunk);font-family:var(--mono);font-size:11.5px}
.slot{cursor:pointer;justify-content:space-between}
.slot.k28{background:var(--sky-soft)}
.slot.k29{background:var(--surface)}
.slot.kx{background:repeating-linear-gradient(45deg,var(--coral-soft),var(--coral-soft) 6px,transparent 6px,transparent 12px);cursor:not-allowed}
.slot.vac{color:var(--muted);font-style:italic}
.slot input{padding:2px 5px;font-size:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
/* SDO calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dn{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:2px 4px}
.cal .d{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:74px;padding:5px 6px;font-size:12.5px;min-width:0;overflow-wrap:anywhere}
.cal .d.out{opacity:.35}
.cal .d.today{border:2px solid var(--sun);box-shadow:0 0 0 2px var(--sun-soft)}
.cal .d .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.cal .d .who{font-weight:700}
.cal .d .note{color:var(--coral);font-weight:600;font-size:11.5px}
.cal .d button{all:unset;cursor:pointer;display:block;width:100%}
/* sheet grids */
.sheet{border-collapse:collapse;font-size:12px}
.sheet td{border:1px solid var(--line);padding:3px 6px;min-width:46px;height:24px;white-space:pre-line;vertical-align:middle;text-align:center}
.sheet td.f{color:var(--cell-ink)}
.sheet td.ed{cursor:text}
.sheet td.ed:hover{outline:2px solid var(--sky);outline-offset:-2px}
/* checklists */
.cols4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.ck{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;font-size:14px;cursor:pointer;min-width:0}
.ck:hover{background:var(--sunk)}
.ck input{width:17px;height:17px;accent-color:var(--mint);flex:none}
.ck.on{color:var(--mint);font-weight:600}
.ck .nt{flex:1;min-width:0}
.ck input.note{width:auto;flex:1;padding:2px 5px;font-size:12px}
/* builder */
.doccards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;margin-bottom:16px}
.doccard{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.doccard b{font-family:var(--display);font-size:17px}
.doccard span{font-size:12.5px;color:var(--muted)}
.doccard[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft)}
.para{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.para .row{justify-content:space-between}
.routing td{padding:4px 6px}
.routing input,.routing select{padding:4px 6px}
.lock{max-width:440px;margin:30px auto;text-align:center}
.lock .key{font-size:44px;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:999px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:20;max-width:calc(100% - 32px)}
.confirm{display:inline-flex;gap:6px;align-items:center;background:var(--coral-soft);border-radius:8px;padding:3px 6px;font-size:13px}
.empty{padding:22px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:var(--r)}
details.box{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 14px}
details.box summary{cursor:pointer;font-weight:700}

.daily{background:linear-gradient(165deg,var(--patch) 0%,var(--patch-deep) 100%);color:#0E1116;border-radius:var(--r);padding:18px 20px 16px;position:relative;overflow:hidden;border-bottom:6px solid var(--sun);box-shadow:inset 0 -3px 0 var(--coral)}
.daily-logo{position:absolute;right:18px;top:50%;transform:translateY(-50%);height:118px;width:auto;pointer-events:none}
.daily-top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#1B2433;border-bottom:1px solid rgba(14,17,22,.25);padding-bottom:8px;margin-right:130px;font-weight:600}
.daily-name{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,54px);letter-spacing:-.02em;line-height:1.02;margin:10px 130px 4px 0;color:#0E1116;text-wrap:balance}
.daily-tag{font-size:15px;color:#1B2433;font-style:italic;margin-right:130px}
.big-name{font-family:var(--display);font-size:22px;font-weight:800;margin-top:4px;overflow-wrap:anywhere}
.tl{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.track{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.step{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:2px 10px 2px 3px;font-size:12.5px;font-weight:600;font-family:inherit}
button.step{cursor:pointer}
.step i{font-style:normal;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--sunk);font-size:11px}
.step.done{color:var(--mint);border-color:transparent;background:var(--mint-soft)} .step.done i{background:var(--mint);color:#fff}
.step.now{color:var(--ink);border-color:var(--sun);background:var(--sun-soft)} .step.now i{background:var(--sun);color:var(--navy)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.ph{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.ph img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--sunk)}
.ph figcaption{display:flex;gap:6px;align-items:center;padding:6px 8px;font-size:13px;min-width:0}
.ph figcaption .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.sdolay{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.sdolay{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.cal{gap:2px}.cal .d{font-size:10.5px;padding:3px;min-height:56px}.cal .dn{font-size:9.5px;padding:0}}
@media (max-width:640px){ .daily-logo{height:70px;top:16px;transform:none;right:12px} .daily-top{margin-right:78px} .daily-name,.daily-tag{margin-right:0} .mast .who{display:none} .week{min-width:900px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="mast">
  <div class="wrap">
    <div class="top">
      <img class="mast-logo" src="logo.png" alt="CS-12 patch">
      <div><h1>CS-12 One Stop Shop</h1><div class="sub">Cadet Squadron 12 · Group 2 · Fall 2026</div></div>
      <div class="who" id="who"></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>
<main class="wrap" id="main"><div class="empty">Loading the squadron's data…</div></main>
<div id="toast" class="toast" hidden></div>
<script>
"use strict";
/* ---------- tiny DOM helper ---------- */
function h(tag, a, ...kids){
  const el=document.createElement(tag);
  if(a) for(const k in a){
    const v=a[k]; if(v==null||v===false) continue;
    if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else if(k==='class') el.className=v;
    else if(k==='style') el.style.cssText=v;
    else if(k==='value') el.value=v;
    else if(k==='checked') el.checked=!!v;
    else el.setAttribute(k,v===true?'':v);
  }
  add(el,kids); return el;
}
function add(el,kids){for(const k of kids){ if(k==null||k===false) continue; if(Array.isArray(k)) add(el,k); else el.append(k instanceof Node?k:document.createTextNode(String(k))); }}
const $=s=>document.querySelector(s);
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function ls(k,v){try{ if(v===undefined){const s=localStorage.getItem('cs12:'+k);return s?JSON.parse(s):null} localStorage.setItem('cs12:'+k,JSON.stringify(v)) }catch(e){return null}}
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(s){ if(!s) return ''; const [y,m,d]=s.split('-').map(Number); return `${d} ${MONTHS[m-1]} ${y}`; }
function fmtShort(s){ if(!s) return ''; const [y,m,d]=s.split('-').map(Number); return `${pad(d)} ${MON3[m-1]} ${String(y).slice(2)}`; }
const today=()=>iso(new Date());
const money=n=>'$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
function workdaysBetween(fromIso,toIso){ let d=new Date(fromIso+'T12:00'),e=new Date(toIso+'T12:00'),n=0; if(e<=d) return 0; while(d<e){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w&&w<6) n++; } return n; }

async function boot(){
  render();
  const claude=window.claude;
  if(!claude||!claude.use){ S.ready=true; S.nodb=true; render(); return; }
  const [db,user,dl,assets]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads'),claude.use('assets')]);
  S.db=db; S.user=user; S.downloads=dl; S.assets=assets; if(user) S.uid=await user.id();
  if(user){ S.isOwner=await user.isOwner(); S.canEdit=await user.canEdit(); const w=await user.can('data.write'); S.canWrite = w===null ? true : !!w; }
  if(!db){ S.ready=true; S.nodb=true; render(); return; }
  let first=0;
  for(const p of DOCS){
    db.doc(p).onSnapshot(s=>{ S.docs[p]=s.exists?s.data():null; if(++first>=DOCS.length) S.ready=true; schedule(); }, e=>console.warn(p,e));
  }
  db.collection('photos').onSnapshot(q=>{S.photos=q.docs.map(d=>({id:d.id,...d.data()}));schedule()},e=>console.warn(e));
  db.collection('dirt').onSnapshot(q=>{S.dirt=q.docs.map(d=>({id:d.id,...d.data()}));schedule()},e=>console.warn(e));
  if(S.canEdit) db.collection('discipline').onSnapshot(q=>{S.discipline=q.docs.map(d=>({id:d.id,...d.data()}));schedule()},e=>console.warn(e));
  db.collection('headsup').onSnapshot(q=>{S.headsup=q.docs.map(d=>({id:d.id,...d.data()}));schedule()},e=>console.warn(e));
  if(S.uid) db.collection('data/users/'+S.uid).onSnapshot(q=>{S.mine=q.docs.map(d=>({id:d.id,...d.data()}));schedule()},e=>console.warn(e));
  db.collection('ldrtasks').onSnapshot(q=>{S.ldr=q.docs.map(d=>({id:d.id,...d.data()}));schedule()},e=>console.warn(e));
  db.collection('actions').onSnapshot(q=>{S.actions=q.docs.map(d=>({id:d.id,...d.data()}));schedule()},e=>console.warn(e));
  setTimeout(()=>{S.ready=true;schedule()},4000);
}
function schedule(){ if(schedule.t) return; schedule.t=requestAnimationFrame(()=>{schedule.t=0; const a=document.activeElement; if(a&&a.closest&&a.closest('#main')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){S.pending=true;return;} render();}); }
document.addEventListener('focusout',()=>setTimeout(()=>{ if(S.pending){ const a=document.activeElement; if(!(a&&a.closest&&a.closest('#main')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){S.pending=false;render();} }},120));

function allPeople(){ const r=D('roster/main'); const out=[]; if(r) r.sections.forEach(s=>s.people.forEach(p=>out.push({...p,section:s.name}))); return out; }
function contactFor(name){ const c=D('staff/contacts'); if(!c||!c.byName) return null; if(c.byName[name]) return c.byName[name]; const n=norm(name); for(const k in c.byName) if(norm(k)===n) return c.byName[k]; const last=n.split(' ').pop(); const hits=Object.keys(c.byName).filter(k=>norm(k).endsWith(' '+last)&&norm(k)[0]===n[0]); return hits.length===1?c.byName[hits[0]]:null; }

// Tonight's CQ shifts from the sign-up sheet (weekday block Mon–Thu, weekend block Fri–Sun)
function cqTonight(){
  const q=D('cq/board'); if(!q) return null; const now=new Date(); const t=new Date(today()+'T12:00'); const dow=now.getDay(); const yr=now.getFullYear();
  const weekend=dow===0||dow===5||dow===6; const fill=q.fill||{};
  const parse=lbl=>{ const m=(lbl||'').match(/(\d{1,2})\/(\d{1,2})\s*-\s*(\d{1,2})\/(\d{1,2})/); if(!m) return null; return [new Date(yr,+m[1]-1,+m[2],12),new Date(yr,+m[3]-1,+m[4],12)]; };
  for(const w of q.weeks){ const r=parse(weekend?w.weLabel:w.label); if(!r||t<r[0]||t>r[1]) continue;
    const col=weekend?({5:4,6:5,0:6})[dow]:dow-1;
    const shifts=w.rows.map(row=>({time:weekend?row.we:row.wd,slot:row.slots[col]})).filter(x=>x.time&&x.slot&&x.slot.k!=='x').map(x=>({time:x.time,name:fill[x.slot.id]||''}));
    return {label:w.days[col],shifts}; }
  return {label:'',shifts:[]};
}

 apply.\nDISCLOSURE:\u00a0 Voluntary, failure to provide SSN may impede proper placement in member's military personnel file.\nSORN:\u00a0 F036 AF PC L, Unfavorable Information Files (UIF).","sz":8.0,"b":true,"i":false,"al":"left"},{"t":"text","x":40.6,"y":150.57,"w":254.13,"h":8.67,"s":"1. Determine the objective of the counseling before the session begins.","sz":8.0,"b":false,"i":false,"al":"left"},{"t":"text","x":40.6,"y":159.57,"w":107.13,"h":8.67,"s":"2. Hear the individual out.","sz":8.0,"b":false,"i":false,"al":"left"},{"t":"text","x":40.6,"y":168.57,"w":213.62,"h":8.67,"s":"3. Treat the member as having worth and dignity.","sz":8.0,"b":false,"i":false,"al":"left"},{"t":"text","x":40.6,"y":177.57,"w":253.37,"h":8.67,"s":"4. Show sincerity, courtesy, and personal interest in the individual.","sz":8.0,"b":false,"i":false,"al":"left"},{"t":"text","x":40.6,"y":186.57,"w":261.62,"h":8.67,"s":"5. Give the individual the facts, whether they are pleasant or unpleasant.","sz":8.0,"b":false,"i":false,"al":"left"},{"t":"text","x":40.6,"y":196.57,"w":212.89,"h":8.67,"s":"6. Don't brush off any problem as being too trivial.","sz":8.0,"b":false,"i":false,"al":"left"},{"t":"text","x":40.6,"y":206.3,"w":171.62,"h":8.67,"s":"7. Don't make snap decisions.","sz":8.0,"b":false,"i":false,"al":"left"},{"t":"text","x":314.2,"y":150.57,"w":204.02,"h":8.67,"s":"8. Don't make promises if you can't keep them.","sz":8.0,"b":false,"i":false,"al":"left"},{"t":"text","x":314.2,"y":159.83,"w":259.52,"h":17.6,"s":"9. Don't force decisions on the person - there may be other equally good and acceptable solutions.","sz":8.0,"b":false,"i":false,"al":"left"},{"t":"text","x":314.2,"y":180.51,"w":147.04,"h":8.67,"s":"10. Refer to other agencies.","sz":8.0,"b":false,"i":false,"al":"left"},{"t":"text","x":314.2,"y":189.68,"w":226.52,"h":8.67,"s":"11. Make contact for the individual with the referral agency.","sz":8.0,"b":false,"i":false,"al":"left"},{"t":"text","x":314.2,"y":199.41,"w":258.78,"h":17. <script>
/* ================= PDF ENGINE (pdf-lib) ================= */
const PH=792, PW=612;
const WIN=/[^\x20-\x7E\xA0-\xFF–—‘’“”•…\n]/g;
const clean=s=>String(s==null?'':s).replace(/\u2192/g,'>').replace(/\r\n?/g,'\n').replace(/\t/g,'    ').replace(WIN,'');
function wrapText(text,font,size,width){
  const out=[];
  clean(text).split('\n').forEach(par=>{
    if(par==='') { out.push(''); return; }
    const words=par.split(/(\s+)/); let line='';
    for(const w of words){
      const test=line+w;
      if(font.widthOfTextAtSize(test.trimEnd(),size)<=width||!line.trim()){
        if(!line.trim()&&font.widthOfTextAtSize(w,size)>width){ // hard-break a long token
          let chunk=''; for(const ch of w){ if(font.widthOfTextAtSize(chunk+ch,size)>width){ out.push(chunk); chunk=ch; } else chunk+=ch; } line=chunk; continue; }
        line=test;
      } else { out.push(line.trimEnd()); line=w.trimStart(); }
    }
    out.push(line.trimEnd());
  });
  return out;
}
async function pdfFonts(doc){ const F=PDFLib.StandardFonts; return {h:await doc.embedFont(F.Helvetica),hb:await doc.embedFont(F.HelveticaBold),hi:await doc.embedFont(F.HelveticaOblique),hbi:await doc.embedFont(F.HelveticaBoldOblique),t:await doc.embedFont(F.TimesRoman),tb:await doc.embedFont(F.TimesRomanBold)}; }
function addSig(doc,page,name,x,yTop,w,hh){
  const {PDFName,PDFString}=PDFLib; const ctx=doc.context;
  const widget=ctx.obj({Type:'Annot',Subtype:'Widget',FT:'Sig',F:4,Rect:[x,PH-yTop-hh,x+w,PH-yTop],P:page.ref});
  widget.set(PDFName.of('T'),PDFString.of(name));
  const ref=ctx.register(widget);
  page.node.addAnnot(ref);
  doc.getForm().acroForm.addField(ref);
}
// Editable text box: prefilled, transparent, so people can keep typing in Adobe after download
function tf(doc,page,font,name,x,yTop,w,hh,val,o={}){
  const form=doc.getForm(); doc.__names=doc.__names||new Set(); let n=String(name).replace(/[.\s]+/g,'_'); let base=n,i=1; while(doc.__names.has(n)||form.getFieldMaybe(n)) n=base+'_'+(++i); doc.__names.add(n);
  const f=form.createTextField(n); if(o.multi) f.enableMultiline(); else f.disableMultiline(); f.disableRichFormatting&&f.disableRichFormatting();
  f.addToPage(page,{x,y:PH-yTop-hh,width:w,height:hh,borderWidth:0,borderColor:undefined,backgroundColor:undefined,font});
  if(o.align==='center') f.setAlignment(PDFLib.TextAlignment.Center); else if(o.align==='right') f.setAlignment(PDFLib.TextAlignment.Right);
  f.setFontSize(o.size||0); if(val!=null&&val!=='') f.setText(clean(val)); f.updateAppearances(font); return f;
}
function drawSpecPage(doc,page,spec,vals,F,sigPrefix){
  const black=PDFLib.rgb(0,0,0);
  for(const it of spec.items){
    if(it.t==='line') page.drawLine({start:{x:it.x1,y:PH-it.y1},end:{x:it.x2,y:PH-it.y2},thickness:0.6,color:black});
    else if(it.t==='rect') page.drawRectangle({x:it.x,y:PH-it.y-it.h,width:it.w,height:it.h,borderColor:black,borderWidth:0.75});
    else if(it.t==='text'){
      const f=it.b&&it.i?F.hbi:it.b?F.hb:it.i?F.hi:F.h; const sz=it.sz||8;
      const lines=wrapText(it.s,f,sz,Math.max(it.w,20)+2); let y=it.y+sz;
      for(const ln of lines){ let x=it.x; const tw=f.widthOfTextAtSize(ln,sz); if(it.al==='center') x=it.x+(it.w-tw)/2; else if(it.al==='right') x=it.x+it.w-tw; page.drawText(ln,{x,y:PH-y,size:sz,font:f,color:black}); y+=sz*1.18; }
    }
    else if(it.t==='field'){
      const v=vals[it.k]; const multi=it.ml||String(v||'').includes('\n'); let sz=it.sz||9;
      if(multi&&v){ for(;;){ const lines=wrapText(v,F.h,sz,(it.w-4)*0.97); if(lines.length*sz*1.17<=it.h||sz<=6) break; sz-=0.5; } }
      else if(v){ while(F.h.widthOfTextAtSize(clean(v),sz)>it.w-4&&sz>6) sz-=0.5; }
      tf(doc,page,F.h,(sigPrefix||'')+it.k,it.x,it.y,it.w,it.h,v,{multi,size:sz,align:it.al==='center'?'center':null});
    }
    else if(it.t==='sig') addSig(doc,page,(sigPrefix||'')+it.k,it.x,it.y,it.w,it.h);
  }
}
async function appendPdf(doc,src){ // copy pages AND keep their form fields live (signature boxes stay clickable)
  const {PDFName}=PDFLib; const pages=await doc.copyPages(src,src.getPageIndices());
  const acro=doc.getForm().acroForm; const seen=new Set();
  for(const p of pages){ doc.addPage(p); const annots=p.node.Annots(); if(!annots) continue;
    for(let i=0;i<annots.size();i++){ let top=annots.get(i); let d=doc.context.lookup(top);
      while(d&&d.get(PDFName.of('Parent'))){ top=d.get(PDFName.of('Parent')); d=doc.context.lookup(top); }
      const key=top.toString(); if(d&&d.get(PDFName.of('T'))&&!seen.has(key)){ seen.add(key); acro.addField(top); } } }
}
async function fetchBytes(url){ const r=await fetch(url); if(!r.ok) throw new Error('Couldn’t load '+url); return new Uint8Array(await r.arrayBuffer()); }
async function savePdf(bytes,filename){
  if(!S.downloads){ toast('Downloads aren’t available in this view. Try another browser.'); return false; }
  try{ await S.downloads.save({filename:filename.replace(/[\\/:*?"<>|]/g,'-'),data:new Blob([bytes],{type:'application/pdf'})}); toast('PDF saved'); return true; }
  catch(e){ if(e&&e.code==='declined') toast('Download cancelled'); else if(e&&e.code==='rate_limited') toast('A save prompt is already open.'); else toast('Couldn’t save the PDF ('+(e&&e.code||'error')+').'); return false; }
}

/* ---- AF 1768 eSSS ---- */
async function buildEsss(d, doc){
  const own=!doc; doc=doc||await PDFLib.PDFDocument.create(); const F=await pdfFonts(doc);
  const page=doc.addPage([PW,PH]);
  const L=['TOONE','TOONE_2','TOONE_3','TOONE_4','TOONE_5'], A=['ACTONE','ACTONE_2','ACTONE_3','ACTONE_4','ACTONE_5'], N=['SIGRDTA','SIGRDTA_3','SIGRDTA_5','SIGRDTA_7','SIGRDTA_9'];
  const R=['TOTWO','TOTWO_2','TOTWO_3','TOTWO_4','TOTWO_5'], RA=['ACTTWO','ACTTWO_2','ACTTWO_3','ACTTWO_4','ACTTWO_5'], RN=['SIGRDB','SIGRDB_3','SIGRDB_5','SIGRDB_7','SIGRDB_9'];
  const v={SUBJECT:d.subject,SURNAME:d.surname,SYMBOL:d.symbol,PHONE:d.phone,FIELD1:d.typist,CalDt:fmtShort(d.suspense),CalDtB:fmtShort(d.created),SUMMARY:d.summary};
  d.routing.forEach((r,i)=>{ if(i<5){v[L[i]]=r.to;v[A[i]]=r.action;v[N[i]]=r.name;} else {v[R[i-5]]=r.to;v[RA[i-5]]=r.action;v[RN[i-5]]=r.name;} });
  // summary may overflow: split onto continuation pages
  const sumIt=SPEC_1768.pages[0].items.find(i=>i.k==='SUMMARY'); const sz=9.5;
  const lines=wrapText(d.summary,F.h,sz,(sumIt.w-4)*0.97); const per=Math.floor(sumIt.h/(sz*1.17));
  v.SUMMARY=lines.slice(0,per).join('\n');
  drawSpecPage(doc,page,SPEC_1768.pages[0],{...v,SUMMARY:lines.length<=per?clean(d.summary):lines.slice(0,per).join('\n')},F,'eSSS_');
  let rest=lines.slice(per); let pn=1;
  while(rest.length){ const p=doc.addPage([PW,PH]); pn++; p.drawText('STAFF SUMMARY SHEET (CONTINUED) · '+clean(d.subject).slice(0,80),{x:40,y:PH-40,size:8,font:F.hb}); const n=Math.floor((PH-100)/(sz*1.17)); tf(doc,p,F.h,'eSSS_SUMMARY_p'+pn,40,54,PW-80,PH-100,rest.slice(0,n).join('\n'),{multi:true,size:sz}); rest=rest.slice(n); }
  return own? await doc.save() : doc;
}

async function buildForm99(d,opt={}){
  const doc=await PDFLib.PDFDocument.load(await fetchBytes('form99.pdf'));
  const form=doc.getForm();
  const map={'NAME Last First MI':d.name,'MERIT LISTS':d.merit,'START Date  TimeRow1':d.start,'RETURN Date  TimeRow1':d.ret,'TAKEN':d.taken,'AUTHORIZED':d.authorized,'ADDRESSRow1':d.address,'PHONERow1':d.phone,'OTHER CADETS':d.others,
    'DATESRow1':d.carDates,'MAKERow1':d.make,'YEARRow1':d.year,'COLORRow1':d.color,'LICENSE NUMBERRow1':d.plate,'STATERow1':d.state,'OWNERRow1':d.owner,'STATERow1_2':d.state,'OWNERRow1_2':d.owner,
    'FLIGHT NUMBERRow1':d.depFlight,'AIRLINERow1':d.depAirline,'DATE  TIMERow1':d.depTime,'FLIGHT NUMBERRow1_2':d.arrFlight,'AIRLINERow1_2':d.arrAirline,'DATE  TIMERow1_2':d.arrTime};
  const multi=new Set(['START Date  TimeRow1','RETURN Date  TimeRow1','ADDRESSRow1','PHONERow1','OTHER CADETS','TAKEN','AUTHORIZED']);
  if(opt.flat){ // draw values straight onto the page and drop the text boxes, so the copy merges cleanly into a combined PDF
    const font=await doc.embedFont(PDFLib.StandardFonts.Helvetica); const pages=doc.getPages();
    for(const k in map){ let f; try{ f=form.getTextField(k); }catch(e){ continue; } const v=clean(map[k]||''); const widgets=f.acroField.getWidgets();
      for(const pg of pages){ const an=pg.node.Annots(); if(!an) continue;
        for(let i=an.size()-1;i>=0;i--){ const wd=doc.context.lookup(an.get(i)); const w=widgets.find(x=>x.dict===wd); if(!w) continue;
          if(v){ const r=w.getRectangle(); const sz=multi.has(k)?8.5:10; const lines=wrapText(v,font,sz,r.width-4); let y=multi.has(k)?r.y+r.height-sz-2:r.y+(r.height-sz)/2+1;
            for(const ln of lines){ if(y<r.y) break; pg.drawText(ln,{x:r.x+2,y,size:sz,font}); y-=sz*1.15; } }
          an.remove(i); } }
      try{ form.acroForm.removeField(f.acroField); }catch(e){ console.warn('drop',k,e.message); } }
    return doc; }
  const helv=await doc.embedFont(PDFLib.StandardFonts.Helvetica);
  for(const k in map){ try{ const f=form.getTextField(k); const sz=multi.has(k)?9:10; if(multi.has(k)) f.enableMultiline(); f.setFontSize(sz);
      for(const w of f.acroField.getWidgets()){ const da=w.getDefaultAppearance&&w.getDefaultAppearance(); if(da) w.setDefaultAppearance(da.replace(/([\d.]+)\s+Tf/,sz+' Tf')); }
      f.setText(clean(map[k]||'')); f.updateAppearances(helv); }catch(e){ console.warn('99 field',k,e.message); } }
  return doc;
}

/* ---- Tongue and Quill memorandum ---- */
async function buildMemo(d){
  const doc=await PDFLib.PDFDocument.create(); const F=await pdfFonts(doc);
  let lh=null; try{ lh=await doc.embedJpg(await fetchBytes('letterhead.jpg')); }catch(e){ console.warn(e); }
  const sz=12, LH=13.8, LM=72, RM=540, W=RM-LM;
  let page=doc.addPage([PW,PH]); let y; let pageNo=1;
  const newPage=()=>{ page=doc.addPage([PW,PH]); pageNo++; y=72; page.drawText(String(pageNo),{x:PW/2-3,y:36,size:sz,font:F.t}); };
  const need=n=>{ if(y+n>PH-72) newPage(); };
  const text=(s,x,f=F.t)=>{ page.drawText(clean(s),{x,y:PH-(y+10),size:sz,font:f}); };
  let fn=0; const box=(val,x,w,lines,name)=>{ tf(doc,page,F.t,name||('Memo_'+(++fn)),x,y-1.5,w,lines*LH+2,val,{multi:lines>1,size:sz}); };
  const para=(s,x0,x1,indentFirst)=>{ // wrap like T&Q (number + two spaces, continuation lines at the margin), then make it one editable box
    const m=clean(s).match(/^((?:\(?[0-9a-z]{1,2}[.)])\s{2})?(.*)$/s); const pre=m[1]||''; const words=m[2].split(/\s+/); let line=pre; let curW=RM-indentFirst; const out=[];
    for(const w of words){ const t=(line&&line!==pre)?line+' '+w:line+w; if(F.t.widthOfTextAtSize(t,sz)<=curW||line===pre||!line) line=t; else { out.push(line); line=w; curW=RM-x1; } }
    if(line) out.push(line);
    const indent=' '.repeat(Math.round((indentFirst-x1)/F.t.widthOfTextAtSize(' ',sz)));

/* ================= OCONUS TRAVEL PACKAGE ================= */
const OC_DEADLINES={thanks:['Thanksgiving Break','2026-11-03'],winter:['Winter Break','2026-11-23'],other:['Other leave','']};
const OC_FILES={advisory:[],apacs:[]}; // uploaded screenshots live in memory only

function ocDefaults(){ return {cadet:'',cls:'C4C',year:'2030',flight:'A',phone:'',homePhone:'',email:'',workPhone:'',brk:'winter',depart:'',ret:'',travelers:'1',companions:'',purpose:'leave',poc:'',background:'',ecName:'',ecRel:'',ecPhone:'',missing:'',
  countries:[{name:'',arrive:'',depart:'',level:'1',hotel:'',hotelPhone:'',embPhone:'',embAddr:'',step:'yes',apacs:'no',fcg1:'',fcg4:''}],
  legs:[{when:'',from:'',to:'',mode:'Flight',carrier:'',num:'',notes:'',out:true,home:false}],
  summary:'',summaryEdited:false,subject:'',subjectEdited:false,routing:[],created:today()}; }
const OC=()=>{ const o=B.oconus||(B.oconus=ocDefaults()); if(!o.routing||!o.routing.length) o.routing=ocRouting(o); return o; };
const ocHigh=o=>o.countries.filter(c=>+c.level>=3);
const ocPlaces=o=>o.countries.map(c=>c.name.trim()).filter(Boolean);
function ocRouting(o){ const rows=routingFor(o); if(ocHigh(o).length){ const i=rows.findIndex(r=>/CC$/.test(r.to)&&r.action==='Approve'); if(i>=0) rows[i]={...rows[i],action:'Coord'}; rows[6]={to:'',action:'Approve',name:'Col Habben'}; } return rows; }
function ocFileBase(o){ const {first,last}=firstLast(o.cadet||''); return `${ddmmm(o.depart)}-${ddmmm(o.ret)}_${ocPlaces(o).join(', ')||'Location'}_${o.cls} ${last||'Last'}, ${first||'First'}`; }
function ocSummary(o){
  const {first,last}=firstLast(o.cadet||'[Your Name]'); const places=ocPlaces(o); const list=places.length>1?places.slice(0,-1).join(', ')+' and '+places.slice(-1):places[0]||'[countries]';
  const p=[];
  p.push(`1.  PURPOSE: The purpose of this staff summary sheet is to request permission to travel OCONUS to ${list} from ${o.depart?fmtDate(o.depart):'[start date]'} to ${o.ret?fmtDate(o.ret):'[end date]'}.`);
  p.push(`2.  BACKGROUND: ${o.background||'[Who, what, when, where and why: who you are traveling with and the reason for the trip.]'}`);
  const legsOut=o.legs.find(l=>l.out), legsHome=o.legs.find(l=>l.home);
  let disc='3.  DISCUSSION: '+(legsOut&&legsOut.when?`I will depart the United States on ${legsOut.when}${legsOut.carrier?' on '+legsOut.carrier+' '+(legsOut.num||''):''}. `:'')+'My travel in chronological order:';
  o.countries.forEach((c,i)=>{ disc+=`\nCountry #${i+1}: ${c.name||'[country]'}\nArrival: ${c.arrive?fmtDate(c.arrive):'[date]'}\nDeparture: ${c.depart?fmtDate(c.depart):'[date]'}\nLodging: ${c.hotel||'[hotel name and address]'}${c.hotelPhone?' ('+c.hotelPhone+')':''}`; });
  disc+=`\n${legsHome&&legsHome.when?`I will return to the United States on ${legsHome.when}${legsHome.carrier?' on '+legsHome.carrier+' '+(legsHome.num||''):''}. `:''}My emergency contact is ${o.ecRel?'my '+o.ecRel+', ':''}${o.ecName||'[name]'}, ${o.ecPhone||'[phone]'}. I can be reached at ${o.phone||'[your cell]'}${o.email?' or '+o.email:''}.`;
  p.push(disc);
  const lv=o.countries.filter(c=>c.name).map(c=>`${c.name} is currently a Level ${c.level} travel advisory.`).join(' ');
  p.push(`4.  CONSIDERATIONS: ${lv||'[Travel advisory level for each country.]'} ${o.missing?`I understand I will miss the following mandatory events: ${o.missing}. `:''}If anything should come up, I will contact my chain of command to ensure that pertinent information reaches the Squadron Commander.`);
  p.push(`5.  RECOMMENDATION: ${ocHigh(o).length?'Sq/CC coordination and approval by Col Habben.':'Sq/CC Approval.'}`);
  p.push(`//SIGNED//\n${first.toUpperCase()} ${last.toUpperCase()}, ${o.cls}, USAF\nAFCW/CS12`);
  return p.join('\n\n');
}

/* ---- builders ---- */
async function ocImagesPdf(list,title){
  const doc=await PDFLib.PDFDocument.create(); const F=await pdfFonts(doc);
  for(const im of list){
    let img; try{ img=/png/i.test(im.type)?await doc.embedPng(im.bytes):await doc.embedJpg(im.bytes); }catch(e){ const j=await toJpeg(im.bytes,im.type); img=await doc.embedJpg(j); }
    const page=doc.addPage([PW,PH]); page.drawText(clean(`${title}${im.label?' - '+im.label:''}`),{x:36,y:PH-40,size:11,font:F.hb});
    const s=Math.min(540/img.width,690/img.height,1.5); const w=img.width*s, hh=img.height*s; page.drawImage(img,{x:(PW-w)/2,y:PH-56-hh,width:w,height:hh});
  }
  return doc;
}
async function toJpeg(bytes,type){ const bmp=await createImageBitmap(new Blob([bytes],{type})); const c=document.createElement('canvas'); c.width=bmp.width; c.height=bmp.height; c.getContext('2d').drawImage(bmp,0,0); const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.9)); return new Uint8Array(await b.arrayBuffer()); }
const xesc=s=>clean(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function wRun(t,o={}){ const pr=`<w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman"/>${o.b?'<w:b/>':''}${o.hl?'<w:highlight w:val="yellow"/>':''}<w:sz w:val="${(o.sz||12)*2}"/></w:rPr>`; return String(t).split('\n').map((ln,i)=>`<w:r>${pr}${i?'<w:br/>':''}<w:t xml:space="preserve">${xesc(ln)}</w:t></w:r>`).join(''); }
function wPara(t,o={}){ // ==text== becomes highlighted
  const parts=String(t||'').split(/(==[\s\S]+?==)/g).filter(x=>x!=='').map(x=>/^==[\s\S]+==$/.test(x)?wRun(x.slice(2,-2),{...o,hl:true}):wRun(x,o));

/* ---- coverage gaps (shared by Supt / CC / CoS) ---- */
function coverageGaps(days=7){
  const out={sdo:[],cq:[]}; const t=today(); const end=iso(new Date(new Date(t+'T12:00').getTime()+days*864e5));
  const s=D('sdo/schedule'); if(s){ for(let i=0;i<days;i++){ const d=iso(new Date(new Date(t+'T12:00').getTime()+i*864e5)); if(!s.days[d]&&!(s.notes&&s.notes[d])) out.sdo.push(d); } }
  const q=D('cq/board'); if(q){ const fill=q.fill||{}; q.weeks.forEach(w=>w.rows.forEach(r=>r.slots.forEach((sl,col)=>{ if(sl.k==='x'||fill[sl.id]) return; const d=cqDateFor(w,col); if(d&&d>=t&&d<end) out.cq.push({date:d,day:w.days[col],time:col<4?r.wd:r.we}); }))); out.cq.sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time)); }
  return out;
}

  return tk.columns.map(c=>{ const due=tkDue(c); const n=daysTo(due); const missing=[]; let done=0,total=0;
    tk.groups.forEach(g=>g.people.forEach(p=>{ const v=(tk.status[p.id]||{})[c.id]||''; if(!v) return; total++; if(/^yes/i.test(v)) done++; else missing.push({name:p.name,rank:p.rank,group:g.name}); }));
    const state=!due?'nodue':missing.length===0?'done':n<0?'overdue':n<=7?'soon':'later';
    return {c,due,n,missing,done,total,state}; });
}

/* ================= FIREBASE BACKEND =================
   Swaps Claude's storage for Firebase (Auth + Firestore) behind the same small API the app already uses,
   so every tab keeps working unchanged. Each record is stored as one JSON string ("j") because some
   grids hold arrays inside arrays, which Firestore can't store natively. */
const FB={ state:'loading', user:null, member:null, fs:null, auth:null };
const PUB_TABS=[['builder','Paperwork Builder'],['links','Docs & Links']];
const OWNER=(window.CS12_OWNER||'').toLowerCase();

function fbConfigured(){ const c=window.FIREBASE_CONFIG; return !!(c&&c.apiKey&&!/PASTE/.test(c.apiKey)&&window.firebase); }
const fbEnc=obj=>({j:JSON.stringify(obj), by:FB.user.uid, at:firebase.firestore.FieldValue.serverTimestamp()});
const fbDec=d=>{ if(!d) return null; if(typeof d.j==='string'){ try{ return JSON.parse(d.j); }catch(e){ return null; } } const {by,at,...rest}=d; return rest; };
function fbMerge(base,patch){
  const out=(base&&typeof base==='object'&&!Array.isArray(base))?{...base}:{};
  for(const k in patch){ const v=patch[k];
    if(v===null||v===undefined) delete out[k];
    else if(typeof v==='object'&&!Array.isArray(v)&&!(v instanceof Date)) out[k]=fbMerge(out[k],v);
    else out[k]=v; }
  return out;
}
function fbErr(e){ const c=e&&e.code||''; return Object.assign(new Error(e&&e.message||'error'),{code:c==='permission-denied'?'invalid_argument':c}); }

function fbDb(){
  const fs=FB.fs;
  const docApi=path=>{ const ref=fs.doc(path); return {
    onSnapshot(cb,err){ return ref.onSnapshot(s=>cb({exists:s.exists,data:()=>fbDec(s.data())}), e=>{ if(e&&e.code==='permission-denied') cb({exists:false,data:()=>null}); else err&&err(e); }); },
    async get(){ const s=await ref.get(); return {exists:s.exists,data:()=>fbDec(s.data())}; },
    async set(obj){ try{ await ref.set(fbEnc(obj)); }catch(e){ throw fbErr(e); } },
    async update(obj){ try{ await fs.runTransaction(async t=>{ const s=await t.get(ref); t.set(ref,fbEnc(fbMerge(s.exists?fbDec(s.data()):{},obj))); }); }catch(e){ throw fbErr(e); } },
    async delete(){ try{ await ref.delete(); }catch(e){ throw fbErr(e); } } }; };
  const colApi=path=>({ onSnapshot(cb,err){ return fs.collection(path).onSnapshot(q=>cb({docs:q.docs.map(d=>({id:d.id,data:()=>fbDec(d.data())}))}), e=>{ if(e&&e.code==='permission-denied') cb({docs:[]}); else err&&err(e); }); } });
  return {doc:docApi, collection:colApi};
}
function fbDownloads(){ return {save:async({filename,data})=>{ const blob=data instanceof Blob?data:new Blob([data]); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),8000); return {status:'saved'}; }}; }
// Photos are stored as compressed images inside Firestore (no paid Storage plan needed)
function fbAssets(){ return {
  async upload(blob){ let max=1400,q=0.72,url='';
    const bmp=await createImageBitmap(blob);
    for(let i=0;i<6;i++){ const k=Math.min(1,max/Math.max(bmp.width,bmp.height)); const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k); c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); url=c.toDataURL('image/jpeg',q); if(url.length<700000) break; max=Math.round(max*0.8); q=Math.max(0.5,q-0.06); }
    if(url.length>=900000) throw Object.assign(new Error('too big'),{code:'quota_exceeded'});
    return {id:'img_'+uid(), url}; },
  async delete(){ } }; }
function fbUser(){ const u=FB.user, m=FB.member||{}; const owner=!!OWNER&&(u.email||'').toLowerCase()===OWNER;

  if(!email) return;
  try{ await FB.auth.signInWithEmailLink(email,location.href); try{localStorage.removeItem('cs12:emailForSignIn')}catch(e){} history.replaceState(null,'',location.pathname); }catch(e){ toast('That sign-in link expired or was already used. Request a new one.'); } }
async function fbSignOut(){ try{ await FB.auth.signOut(); }catch(e){} location.hash=''; location.reload(); }
async function fbRequestAccess(name){ if(!name.trim()) return toast('Enter your name as it appears on the roster.');
  try{ await FB.fs.doc('requests/'+FB.user.email.toLowerCase()).set({email:FB.user.email.toLowerCase(),name:name.trim(),uid:FB.user.uid,created:new Date().toISOString()}); FB.requested=true; render(); toast('Request sent to squadron staff'); }catch(e){ toast('Couldn’t send the request. Try again.'); } }

function signInPanel(){
  const st=S.edit.signin||(S.edit.signin={email:'',name:''});
  if(!fbConfigured()) return h('div',{class:'panel lock'},h('img',{src:'logo.png',alt:'',style:'height:76px;width:auto;margin:0 auto'}),h('h2',{class:'pg'},'Squadron Hub'),h('p',{class:'muted'},'The squadron hub isn’t connected yet. The site owner needs to paste the Firebase settings into config.js.'));
  if(FB.state==='out') return h('div',{class:'panel lock'},h('img',{src:'logo.png',alt:'',style:'height:76px;width:auto;margin:0 auto'}),h('h2',{class:'pg'},'Sign in to the Squadron Hub'),
    h('p',{class:'muted'},'The Dozen Daily, My Squadron, duty schedules, taskers, DIRT and photos are for CS-12 members. Sign in, then request access once.'),
    h('button',{class:'btn pri',style:'margin:6px auto 0',onclick:fbGoogle},'Continue with Google'),
    h('div',{class:'small muted',style:'margin:14px 0 6px'},'Or get a one-time sign-in link by email (works with any address):'),
    FB.linkSent? h('div',{class:'banner info small'},'Link sent to ',h('b',null,FB.linkSent),'. Open it on this device to finish signing in. Check junk mail if it’s not there in a minute.')
    : h('div',{class:'row',style:'justify-content:center'},h('input',{type:'email',id:'fbem',placeholder:'you@example.com',value:st.email,style:'max-width:260px',oninput:e=>st.email=e.target.value,onkeydown:e=>{if(e.key==='Enter') fbEmailLink(st.email)}}),h('button',{class:'btn',onclick:()=>fbEmailLink(st.email)},'Email me a link')));
  if(FB.state==='pending') return h('div',{class:'panel lock'},h('img',{src:'logo.png',alt:'',style:'height:76px;width:auto;margin:0 auto'}),h('h2',{class:'pg'},FB.requested?'Request sent':'Request access'),
    h('p',{class:'muted'},'Signed in as ',h('b',null,FB.user.email),'. ',FB.requested?'Squadron staff will approve you soon. Refresh this page once they do.':'Squadron staff approve each member once.'),
    FB.requested?null:h('div',{class:'row',style:'justify-content:center'},h('input',{type:'text',id:'fbnm',placeholder:'Name as it appears on the roster',value:st.name,style:'max-width:280px',oninput:e=>st.name=e.target.value}),h('button',{class:'btn pri',onclick:()=>fbRequestAccess(st.name)},'Request access')),
    h('button',{class:'btn sm',style:'margin:12px auto 0',onclick:fbSignOut},'Sign out'));
  return h('div');
}

/* ---------- Access tab (staff): approve members, set staff, import data ---------- */
VIEWS.access=function(){
  if(!S.canEdit) return emptyState('Staff only.');
  const st=S.edit.acc||(S.edit.acc={email:'',role:'member',name:''});
  const reqs=FB.requests||[], mems=(FB.members||[]).slice().sort((a,b)=>(a.role===b.role?0:a.role==='staff'?-1:1)||a.id.localeCompare(b.id));
  const approve=async(e,role,name)=>{ e=e.trim().toLowerCase(); if(!/@/.test(e)) return toast('Enter an email address.'); try{ await FB.fs.doc('members/'+e).set({role,name:name||'',added:new Date().toISOString(),addedBy:FB.user.email}); await FB.fs.doc('requests/'+e).delete().catch(()=>{}); toast('Access granted'); }catch(x){ toast('Only staff can do that.'); } };
  const remove=async e=>{ try{ await FB.fs.doc('members/'+e).delete(); toast('Removed'); }catch(x){ toast('Only staff can do that.'); } };
  return h('div',{class:'stack'},head('Access','Who can sign in to the squadron hub. Staff get edit rights and the locked tabs.'),
    h('div',{class:'grid2'},
      h('div',{class:'panel'},h('h3',null,'Requests ',reqs.length?h('span',{class:'chip Sent'},String(reqs.length)):null),
        reqs.length?h('ul',{class:'list'},reqs.map(r=>h('li',null,h('div',{class:'grow'},h('b',null,r.name||'(no name)'),h('div',{class:'small muted mono'},r.id)),
          h('button',{class:'btn sm pri',onclick:()=>approve(r.id,'member',r.name)},'Approve'),h('button',{class:'btn sm',onclick:()=>approve(r.id,'staff',r.name)},'As staff'),
          confirmBtn('Deny',()=>FB.fs.doc('requests/'+r.id).delete().catch(()=>toast('Only staff can do that.')))))):h('p',{class:'muted'},'No one is waiting.'),
        h('h4',{style:'margin-top:16px'},'Add someone directly'),
        h('div',{class:'fgrid'},fld(st,'email','Email',{id:'acem'}),fld(st,'name','Name',{id:'acnm'}),fld(st,'role','Access',{type:'select',options:['member','staff'],id:'acrl'})),
        h('button',{class:'btn pri',style:'margin-top:8px',onclick:()=>{ approve(st.email,st.role,st.name); st.email=''; st.name=''; }},'Add')),
      h('div',{class:'panel'},h('h3',null,`Members (${mems.length})`),
        mems.length?h('div',{class:'tw',style:'max-height:60vh'},h('table',{class:'t'},h('thead',null,h('tr',null,h('th',null,'Email'),h('th',null,'Name'),h('th',null,'Access'),h('th',null,''))),
          h('tbody',null,mems.map(m=>h('tr',null,h('td',{class:'small mono',style:'overflow-wrap:anywhere'},m.id),h('td',{class:'small'},m.name||''),
            h('td',null,h('select',{'aria-label':'Access for '+m.id,onchange:e=>FB.fs.doc('members/'+m.id).set({role:e.target.value},{merge:true}).catch(()=>toast('Only staff can do that.'))},['member','staff'].map(o=>{ const op=h('option',{value:o},o); if(m.role===o) op.selected=true; return op; }))),
            h('td',null,m.id===OWNER?h('span',{class:'small muted'},'owner'):confirmBtn('Remove',()=>remove(m.id)))))))):h('p',{class:'muted'},'No members yet. Approve requests or add people on the left.'))),
    S.isOwner?h('div',{class:'panel'},h('h3',null,'Import squadron data'),h('p',{class:'small muted'},'One-time move from the Claude version. Pick the cs12-data-import.json file (keep that file private, don’t upload it to GitHub). Existing records with the same name are replaced.'),
      h('input',{type:'file',accept:'application/json,.json',onchange:async e=>{ const f=e.target.files[0]; if(!f) return; try{ const data=JSON.parse(await f.text()); const n=await fbImport(data); toast(`Imported ${n} records`); }catch(x){ console.error(x); toast('Import failed: '+(x.message||x)); } }})):null);
};
async function fbImport(data){ const paths=Object.keys(data); let b=FB.fs.batch(), n=0, inBatch=0;
  for(const p of paths){ if(p.split('/').length%2) continue; b.set(FB.fs.doc(p),fbEnc(data[p])); n++; if(++inBatch>=200){ await b.commit(); b=FB.fs.batch(); inBatch=0; } }
  if(inBatch) await b.commit(); return n; }

/* ---------- boot ---------- */
const _appBoot=boot;
function publicMode(){
  window.PUBLIC=true; window.claude=undefined;
  TABS.splice(0,TABS.length,...PUB_TABS,['hub','Squadron Hub']);
  S.ready=true; S.nodb=false; S.db=null; S.canEdit=false; S.canWrite=false; S.downloads=fbDownloads();
  S.docs['config/site']=PUBLIC_SITE;
  sendHeadsUp=async()=>{}; saveMyDraft=async()=>{}; sendDiscipline=async()=>{};
  if(!TABS.some(t=>t[0]===S.tab)) S.tab=FB.state==='loading'?'builder':'hub';
}
VIEWS.hub=signInPanel;
boot=async function(){
  if(!fbConfigured()){ FB.state='out'; publicMode(); render(); return; }
  if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
  FB.auth=firebase.auth(); FB.fs=firebase.firestore();
  try{ await FB.fs.enablePersistence({synchronizeTabs:true}); }catch(e){}
  try{ await FB.auth.getRedirectResult(); }catch(e){}
  await fbFinishLink();
  const want=S.tab; publicMode(); render();
  let started=false;
  FB.auth.onAuthStateChanged(async u=>{
    if(started){ if(!u||u.uid!==FB.user.uid) location.reload(); return; }
    FB.user=u;
    if(!u){ FB.state='out'; render(); return; }
    const em=(u.email||'').toLowerCase();
    let m=null; try{ const s=await FB.fs.doc('members/'+em).get(); m=s.exists?s.data():null; }catch(e){}
    if(!m&&OWNER&&em===OWNER){ m={role:'staff',name:'Owner'}; try{ await FB.fs.doc('members/'+em).set({role:'staff',name:u.displayName||'Owner',added:new Date().toISOString()},{merge:true}); }catch(e){} }
    if(!m){ FB.state='pending'; try{ FB.requested=(await FB.fs.doc('requests/'+em).get()).exists; }catch(e){} S.tab='hub'; render(); return; }
    started=true; FB.state='member'; FB.member=m; window.PUBLIC=false;
    TABS.splice(0,TABS.length,...FULL_TABS); if(m.role==='staff'||em===OWNER) TABS.push(['access','Access 🔑']);
    S.tab=TABS.some(t=>t[0]===want)?want:'home';
    sendHeadsUp=_sendHeadsUp; saveMyDraft=_saveMyDraft; sendDiscipline=_sendDiscipline;
    const db=fbDb(), user=fbUser(), dl=fbDownloads(), assets=fbAssets();
    window.claude={use:async cap=>({db,user,downloads:dl,assets})[cap]||null};
    S.ready=false; S.docs={};
    await _appBoot();
    if(S.canEdit){
      FB.fs.collection('requests').onSnapshot(q=>{FB.requests=q.docs.map(d=>({id:d.id,...d.data()}));schedule()},()=>{});
      FB.fs.collection('members').onSnapshot(q=>{FB.members=q.docs.map(d=>({id:d.id,...d.data()}));schedule()},()=>{});
    }
  });
};
const FULL_TABS=TABS.slice();
const _sendHeadsUp=sendHeadsUp, _saveMyDraft=saveMyDraft, _sendDiscipline=sendDiscipline;
const _renderTabs0=renderTabs;
renderTabs=function(){ _renderTabs0();
  const who=$('#who');
  if(FB.state==='member'){ const em=FB.user.email; who.replaceChildren(h('span',{class:'pill '+(S.canEdit?'staff':'view')},S.canEdit?'Staff':'Member'),h('button',{class:'btn sm',style:'margin-left:6px;background:transparent;color:#fff;border-color:rgba(255,255,255,.45)',title:em,onclick:fbSignOut},'Sign out')); }
  else if(FB.state==='pending') who.replaceChildren(h('button',{class:'btn sm',style:'background:transparent;color:#fff;border-color:rgba(255,255,255,.45)',onclick:fbSignOut},'Sign out'));
  else if(fbConfigured()) who.replaceChildren(h('button',{class:'btn sm sun',onclick:()=>go('hub')},'Sign in'));
  else who.replaceChildren(h('span',{class:'pill view'},'Public site'));
};
</script>
<script>
(function(){
  const sub=ls('sub'); if(sub) S.sub=sub;
  let hash=(location.hash||'').slice(1); if(hash==='oconus'){ hash='builder'; S.sub.doc='oconus'; } if(hash==='taskers'){ hash='sqstaff'; S.sub.sqrole='taskers'; } if(hash==='logistics'){ hash='sqstaff'; S.sub.sqrole='recall'; } const t=TABS.some(x=>x[0]===hash)?hash:(ls('tab')||'home');
  S.tab=TABS.some(x=>x[0]===t)?t:'home';
  boot();
})();
